            <path d="M29 11H13.5C8.8 11 5 14.8 5 19.5C5 24.2 8.8 28 13.5 28H16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M23.5 5.5L29.5 11L23.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="26" y="28" fill="currentColor" font-family="var(--font-bold)" font-weight="700" font-size="12.5" text-anchor="middle">10</text>
          </svg>
        </button>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <!-- Reproductor natiu HTML5 (màxima estabilitat i suport d'AirPlay i fons) -->
  <audio id="audioPlayer" preload="auto" autoplay playsinline x-webkit-airplay="allow"></audio>

  <script>
    const STREAMS = {
      catradio: {
        name: "Catalunya Ràdio",
        pvideoId: "cr",
        logo: "/logos/catradio.svg",
        accent: "#FFD100",
        ambient: "rgba(255, 209, 0, 0.14)",
        urls: {
          barcelona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-hls/master.m3u8",
          girona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-girona-hls/master.m3u8",
          lleida: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-lleida-hls/master.m3u8",
          tarragona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-tarragona-hls/master.m3u8"
        },
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      digital: {
        name: "CatRàdio Exclusiu Digital",
        pvideoId: "ocr1",
        logo: "/logos/exclusiudigital.svg",
        accent: "#F5A800",
        ambient: "rgba(245, 168, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-digital-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      catinfo: {
        name: "3CatInfo",
        pvideoId: "ci",
        logo: "/logos/info.svg",
        accent: "#F25400",
        ambient: "rgba(242, 84, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-informacio-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyainformacioHD.mp3"
      },
      icat: {
        name: "iCat",
        pvideoId: "ic",
        logo: "/logos/icat.svg",
        accent: "#C4162A",
        ambient: "rgba(196, 22, 42, 0.16)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/icat-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/icatHD.mp3"
      },
      catmusica: {
        name: "Catalunya Música",
        pvideoId: "cm",
        logo: "/logos/catmus.svg",
        accent: "#429B2B",
        ambient: "rgba(66, 155, 43, 0.15)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-musica-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyamusicaHD.mp3"
      }
    };

    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const spinner = document.getElementById("spinner");
    const statusMsg = document.getElementById("statusMsg");
    const programTitle = document.getElementById("programTitle");
    const programHost = document.getElementById("programHost");
    const programContext = document.getElementById("programContext");
    const nextPill = document.getElementById("nextPill");
    const artworkWrapper = document.getElementById("artworkWrapper");
    const artwork = document.getElementById("artwork");
    const territorialRow = document.getElementById("territorialRow");
    const territorialSelect = document.getElementById("territorialSelect");
    const timeshiftBox = document.getElementById("timeshiftBox");
    const back10Btn = document.getElementById("back10Btn");
    const fwd10Btn = document.getElementById("fwd10Btn");
    const clockDisplay = document.getElementById("clockDisplay");
    const clockHourHand = document.getElementById("clockHourHand");
    const clockMinuteHand = document.getElementById("clockMinuteHand");
    const hourBtnHourHand = document.getElementById("hourBtnHourHand");
    const hourBtnMinuteHand = document.getElementById("hourBtnMinuteHand");
    const listeningClock = document.getElementById("listeningClock");
    const scrubberWrap = document.getElementById("scrubberWrap");
    const lagTag = document.getElementById("lagTag");
    const liveJumpBtn = document.getElementById("liveJumpBtn");
    const hourJumpBtn = document.getElementById("hourJumpBtn");
    const hourJumpLabel = document.getElementById("hourJumpLabel");
    const scrubber = document.getElementById("scrubber");
    const appShell = document.querySelector(".app-shell");
    const stationsGrid = document.getElementById("stationsGrid");
    const stationSliderPill = document.getElementById("stationSliderPill");

    // Assegura el 100% de l'alçada visual en navegadors mòbils tant en vertical com en horitzontal
    function syncViewportHeight() {
      const isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      const vvHeight = window.visualViewport ? Math.round(window.visualViewport.height) : 0;
      const innerH = Math.round(window.innerHeight || 0);
      const clientH = Math.round(document.documentElement.clientHeight || 0);
      const targetH = Math.max(innerH, clientH, vvHeight);
      if (targetH > 0) {
        document.documentElement.style.setProperty("--app-height", `${targetH}px`);
      }
      requestAnimationFrame(() => updateStationPillToCurrent());
    }

    const STREAM_DELAY_SECONDS = 32; // Compensació exacta del retard del flux HLS DVR (ajustat per quadrar exacte amb l'hora en punt)
    const LIVE_EDGE_CUSHION_SECONDS = 24; // Coixí de seguretat (4 segments HLS de 6s) per evitar micro-talls al directe
    let currentStation = "catradio";
    let lastStationSwitchTimestamp = Date.now();
    const isIOSDevice = (() => {
      if (typeof navigator === "undefined") return false;
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    })();
    let isPlaying = false;
    let userWantedPlaying = false;
    let manualPauseRequested = false;
    let wasInterruptedExternally = false;
    let resumeSavedTime = null;
    let initialLiveCushionApplied = false;
    let streamLoadTimestamp = 0;
    let peakMediaMinusWall = null;
    let lastAutoplayUnlockMs = 0;
    let hlsInstance = null;
    let isScrubbing = false;
    let lagBubbleHideTimer = null;
    let seekPulseTimer = null;
    let currentLagSeconds = 0;
    let pausedAtEmissionMs = null;
    let pausedAudioCurrentTime = null;
    let pendingResumeTargetTime = null;
    let scrubWindowSeconds = 7200;
    let activeStreamUrl = null;
    let watchdogTimer = null;
    let clockTimer = null;
    let metadataTimer = null;
    let allChannelsData = {};
    let liveChannelData = null;
    let lastRenderedProgramKey = "";
    let currentArtworkTarget = "";
    let artworkLoadToken = 0;

    function updateStationPillToCurrent() {
      if (!stationsGrid || !stationSliderPill) return;
      const activeBtn = stationsGrid.querySelector(`.station-btn[data-id="${currentStation}"]`) ||
        stationsGrid.querySelector(".station-btn.active");
      if (!activeBtn) return;
      stationSliderPill.classList.remove("is-dragging");
      stationSliderPill.style.setProperty("--pill-w", `${activeBtn.offsetWidth}px`);
      stationSliderPill.style.setProperty("--pill-h", `${activeBtn.offsetHeight}px`);
      stationSliderPill.style.setProperty("--pill-x", `${activeBtn.offsetLeft}px`);
      stationSliderPill.style.setProperty("--pill-color", STREAMS[currentStation].accent);
    }

    syncViewportHeight();
    window.addEventListener("resize", syncViewportHeight);
    window.addEventListener("orientationchange", () => {
      syncViewportHeight();
      setTimeout(syncViewportHeight, 60);
      setTimeout(syncViewportHeight, 180);
    });
    window.addEventListener("pageshow", () => {
      syncViewportHeight();
      setTimeout(syncViewportHeight, 100);
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        syncViewportHeight();
        setTimeout(syncViewportHeight, 100);
      }
    });

    function isTimeshiftSupported() {
      if (currentStation === "catradio" && territorialSelect.value !== "barcelona") {
        return false;
      }
      return true;
    }

    function updateTimeshiftVisibility() {
      const supported = isTimeshiftSupported();
      timeshiftBox.classList.toggle("timeshift-hidden", !supported);
      back10Btn.classList.toggle("timeshift-hidden", !supported);
      fwd10Btn.classList.toggle("timeshift-hidden", !supported);
      liveJumpBtn.classList.toggle("timeshift-hidden", !supported);
      hourJumpBtn.classList.toggle("timeshift-hidden", !supported);
      if (!supported) {
        liveJumpBtn.classList.remove("is-behind");
        lagTag.textContent = "";
        lagTag.classList.remove("is-visible");
      }
    }

    function getStreamUrl() {
      const st = STREAMS[currentStation];
      if (currentStation === "catradio") {
        return st.urls[territorialSelect.value] || st.urls.barcelona;
      }
      return st.url;
    }

    function syncMediaSession(title, artist, artworkUrl) {
      if (!("mediaSession" in navigator)) return;
      const defaultIconUrl = new URL("/catradio_player.jpg", window.location.origin).href;
      const art = artworkUrl || defaultIconUrl;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: artist,
        album: currentStation === "icat" ? "iCat (3Cat)" : "3Cat Directe",
        artwork: [
          { src: art, sizes: "512x512", type: "image/jpeg" },
          { src: defaultIconUrl, sizes: "512x512", type: "image/jpeg" }
        ]
      });
    }

    function formatSongText(str) {
      if (!str || typeof str !== "string") return "";
      const trimmed = str.trim();
      const letters = trimmed.replace(/[^a-zA-ZàèéíòóúçÀÈÉÍÒÓÚÇ]/g, "");
      if (letters.length > 3) {
        const uppercaseCount = (letters.match(/[A-ZÀÈÉÍÒÓÚÇ]/g) || []).length;
        if (uppercaseCount / letters.length > 0.75) {
          return trimmed.toLowerCase().replace(/(?:^|\s|\(|\[|-|\/)\S/g, (char) => char.toUpperCase());
        }
      }
      return trimmed;
    }

    let icatPollTimer = null;

    async function fetchIcatNowPlaying() {
      if (currentStation !== "icat") return;
      try {
        const res = await fetch(`https://dinamics.3cat.cat/wsarafem/arafem/radio/ic/geo/cat?_=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        const araFem = data?.canal?.ara_fem;
        if (!araFem) return;

        if (!allChannelsData.icat) {
          allChannelsData.icat = {
            id: "icat",
            channel: "icat",
            title: "iCat",
            host: "iCat",
            artwork: null
          };
        }

        if (araFem.titol_programa) {
          const prog = araFem.titol_programa.trim();
          allChannelsData.icat.programTitle = prog;
          if (!allChannelsData.icat.title || allChannelsData.icat.title === "iCat") {
            allChannelsData.icat.title = prog;
          }
        }
        if (araFem.presentador && (!allChannelsData.icat.host || allChannelsData.icat.host === "iCat")) {
          allChannelsData.icat.host = araFem.presentador.trim();
        }

        if (!allChannelsData.icat.artwork && Array.isArray(araFem.imatges)) {
          const square = araFem.imatges.find((im) => im.mida === "314x314" || im.mida === "300x300");
          if (square?.text) allChannelsData.icat.artwork = square.text;
        }

        const arasona = araFem.arasona;
        if (arasona && arasona.titol && typeof arasona.titol === "string" && arasona.titol.trim()) {
          let rawImg = (Array.isArray(arasona.imatges) && arasona.imatges[0] && arasona.imatges[0].text) || null;
          if (rawImg && rawImg.includes("statics.ccma.cat")) {
            rawImg = rawImg.replace("statics.ccma.cat", "statics.3cat.cat");
          }
          allChannelsData.icat.song = {
            title: arasona.titol.trim(),
            artist: (arasona.artista || "").trim(),
            artwork: rawImg || null,
            startTime: arasona.start_time || null,
            endTime: arasona.end_time || null
          };
        } else {
          allChannelsData.icat.song = null;
        }

        if (currentStation === "icat") {
          liveChannelData = allChannelsData.icat;
          lastRenderedProgramKey = "";
          updateDvrClockUI();
        }
      } catch (e) {
        // Fallback silenciat (es cobreix amb /api/graella)
      }
    }

    function setArtworkSafe(url, fallbackLogo) {
      const targetKey = url ? `img:${url}` : `logo:${fallbackLogo}`;
      if (targetKey === currentArtworkTarget) return;
      currentArtworkTarget = targetKey;
      const token = ++artworkLoadToken;

      if (!url) {
        artwork.onerror = null;
        artwork.onload = null;
        artwork.src = fallbackLogo;
        artwork.classList.add("is-logo-fallback");
        return;
      }

      const preloader = new Image();
      preloader.onload = () => {
        if (token !== artworkLoadToken) return;
        artwork.onerror = null;
        artwork.onload = null;
        artwork.src = url;
        artwork.classList.remove("is-logo-fallback");
      };
      preloader.onerror = () => {
        if (token !== artworkLoadToken) return;
        currentArtworkTarget = `logo:${fallbackLogo}`;
        artwork.onerror = null;
        artwork.onload = null;
        artwork.src = fallbackLogo;
        artwork.classList.add("is-logo-fallback");
      };
      preloader.src = url;
    }

    // Llegeix la programació i caràtula reals des de /api/graella (Vercel)
    async function fetchLiveProgramMetadata() {
      const st = STREAMS[currentStation];
      const terrName = territorialSelect.options[territorialSelect.selectedIndex].text;
      const defaultSubtitle = currentStation === "catradio"
        ? `Connexió territorial: ${terrName}`
        : "Emissió en directe";

      if (currentStation === "icat") {
        fetchIcatNowPlaying();
      }

      try {
        const res = await fetch(`/api/graella?t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data?.channels && typeof data.channels === "object") {
            allChannelsData = data.channels;
          }
          const info = allChannelsData?.[currentStation];
          if (info && info.title) {
            liveChannelData = info;
            lastRenderedProgramKey = "";
            updateDvrClockUI();
            return;
          }
        }
      } catch (e) {
        console.warn("No s'ha pogut obtenir /api/graella:", e);
      }

      if (allChannelsData?.[currentStation]?.title) {
        liveChannelData = allChannelsData[currentStation];
        lastRenderedProgramKey = "";
        updateDvrClockUI();
        return;
      }

      // Fallback net sense inventar programes si no hi ha resposta
      liveChannelData = null;
      lastRenderedProgramKey = "";
      programTitle.textContent = st.name;
      programHost.textContent = defaultSubtitle;
      if (programContext) {
        programContext.textContent = "";
        programContext.classList.remove("is-visible");
      }
      nextPill.classList.remove("is-visible");
      setArtworkSafe(null, st.logo);
      syncMediaSession(st.name, defaultSubtitle);
    }

    function updateProgramForTimestamp(emissionTimestampMs, isHistorical) {
      const st = STREAMS[currentStation];
      const terrName = territorialSelect.options[territorialSelect.selectedIndex].text;
      const defaultSubtitle = currentStation === "catradio"
        ? `Connexió territorial: ${terrName}`
        : "Emissió en directe";

      if (!liveChannelData) {
        const fallbackKey = `${currentStation}|fallback|${defaultSubtitle}`;
        if (fallbackKey !== lastRenderedProgramKey) {
          lastRenderedProgramKey = fallbackKey;
          programTitle.textContent = st.name;
          programHost.textContent = defaultSubtitle;
          if (programContext) {
            programContext.textContent = "";
            programContext.classList.remove("is-visible");
          }
          nextPill.classList.remove("is-visible");
          setArtworkSafe(null, st.logo);
          syncMediaSession(st.name, defaultSubtitle);
        }
        return;
      }

      const TWENTY_MIN_MS = 20 * 60 * 1000;
      const liveRemainingMs = liveChannelData.endMs ? (liveChannelData.endMs - emissionTimestampMs) : null;
      const showLiveNext = liveRemainingMs !== null && liveRemainingMs > 0 && liveRemainingMs <= TWENTY_MIN_MS;

      const isSongAvailable = currentStation === "icat" && liveChannelData.song && liveChannelData.song.title;
      const currentProgramName = liveChannelData.programTitle || liveChannelData.title || st.name;
      const isSongApplicable = isSongAvailable && !isHistorical;

      let chosen = {
        title: isSongApplicable ? formatSongText(liveChannelData.song.title) : liveChannelData.title,
        host: isSongApplicable ? formatSongText(liveChannelData.song.artist || currentProgramName) : (liveChannelData.host || defaultSubtitle),
        artwork: isSongApplicable ? (liveChannelData.song.artwork || liveChannelData.artwork) : liveChannelData.artwork,
        next: showLiveNext ? (liveChannelData.next || "") : "",
        programContext: isSongApplicable ? currentProgramName : ""
      };

      // Cerquem a la graella horària quin programa s'emetia en l'instant d'emissió (tant en directe com tirant enrere)
      if (Array.isArray(liveChannelData.schedule) && liveChannelData.schedule.length > 0) {
        const idx = liveChannelData.schedule.findIndex((item) => {
          const end = item.endMs || (item.startMs + 4 * 3600 * 1000);
          return emissionTimestampMs >= item.startMs && emissionTimestampMs < end;
        });

        if (idx !== -1) {
          const slot = liveChannelData.schedule[idx];
          const nextSlot = liveChannelData.schedule[idx + 1];
          const slotEndMs = slot.endMs || (nextSlot ? nextSlot.startMs : null);
          const remainingMs = slotEndMs ? (slotEndMs - emissionTimestampMs) : null;
          const isWithin20Min = remainingMs !== null && remainingMs > 0 && remainingMs <= TWENTY_MIN_MS;

          const nextHourStr = nextSlot
            ? new Date(nextSlot.startMs).toLocaleTimeString("ca-ES", { hour: "2-digit", minute: "2-digit" })
            : "";

          const candidateNext = nextSlot
            ? `A continuació: ${nextHourStr} ${nextSlot.title}`.trim()
            : (isHistorical ? "" : (liveChannelData.next || ""));

          const isSameAsLive =
            !isHistorical ||
            (slot.title && liveChannelData.title && slot.title.trim().toLowerCase() === liveChannelData.title.trim().toLowerCase());

          chosen = {
            title: isSongApplicable ? formatSongText(liveChannelData.song.title) : (isSameAsLive ? (liveChannelData.title || slot.title) : slot.title),
            host: isSongApplicable ? formatSongText(liveChannelData.song.artist || currentProgramName) : ((isSameAsLive ? (liveChannelData.host || slot.host) : (slot.host || "")) || defaultSubtitle),
            artwork: isSongApplicable ? (liveChannelData.song.artwork || slot.artwork || liveChannelData.artwork) : (isSameAsLive ? (liveChannelData.artwork || slot.artwork) : (slot.artwork || liveChannelData.artwork)),
            next: isWithin20Min ? candidateNext : "",
            programContext: isSongApplicable ? currentProgramName : ""
          };
        }
      }

      // Només mostrem "A continuació" quan s'està reproduint activament, no s'està fent scrub, no s'està canviant d'emissora i fa una estona que s'escolta la mateixa emissora
      const isSwitchingStation = (Date.now() - lastStationSwitchTimestamp) < 20000;
      const isStationDragging = Boolean(stationDragState);
      const visibleNext = (isPlaying && !isScrubbing && !isStationDragging && !isSwitchingStation) ? chosen.next : "";

      // El programa sota la cançó només apareix quan estem escoltant de forma estable i NO s'està desplaçant entre emissores (per evitar desplaçar la miniatura)
      const visibleProgramContext = (chosen.programContext && !isStationDragging && !isSwitchingStation && !isScrubbing)
        ? `Programa: ${chosen.programContext}`
        : "";

      const renderKey = `${currentStation}|${chosen.title}|${chosen.host}|${chosen.artwork}|${visibleNext}|${visibleProgramContext}`;
      if (renderKey === lastRenderedProgramKey) return;
      lastRenderedProgramKey = renderKey;

      programTitle.textContent = chosen.title;
      programHost.textContent = chosen.host;

      if (programContext) {
        if (visibleProgramContext) {
          programContext.textContent = visibleProgramContext;
          programContext.classList.add("is-visible");
        } else {
          programContext.classList.remove("is-visible");
          programContext.textContent = "";
        }
      }

      if (visibleNext) {
        nextPill.textContent = visibleNext;
        nextPill.classList.add("is-visible");
      } else {
        nextPill.classList.remove("is-visible");
      }
      setArtworkSafe(chosen.artwork, st.logo);
      syncMediaSession(chosen.title, chosen.host || st.name, chosen.artwork);
    }

    function getSeekableRange() {
      if (audio.seekable && audio.seekable.length > 0) {
        const end = audio.seekable.end(audio.seekable.length - 1);
        const start = audio.seekable.start(0);
        if (isFinite(start) && isFinite(end) && end > start) {
          return { start, end };
        }
      }
      if (audio.buffered && audio.buffered.length > 0) {
        const end = audio.buffered.end(audio.buffered.length - 1);
        const start = audio.buffered.start(0);
        if (isFinite(start) && isFinite(end) && end > start) {
          return { start, end };
        }
      }
      return null;
    }

    function formatCatalanTime(dateObj) {
      return dateObj.toLocaleTimeString("ca-ES", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getSafeLiveTarget(range) {
      if (!range) return null;
      const nowSec = Date.now() / 1000;
      const sampleOffset = range.end - nowSec;
      if (peakMediaMinusWall === null || Math.abs(sampleOffset - peakMediaMinusWall) > 30) {
        peakMediaMinusWall = sampleOffset;
      } else if (sampleOffset >= peakMediaMinusWall) {
        peakMediaMinusWall = sampleOffset;
      } else {
        // Suau adaptació per si hi ha un lleuger desfasament de rellotge a llarg termini
        peakMediaMinusWall -= 0.0005;
      }
      // Interpola l'esglaó de 6 segons dels segments HLS perquè el punt de referència avanci de forma contínua amb Date.now()
      const continuousEnd = Math.min(range.end + 6, Math.max(range.end - 6, nowSec + peakMediaMinusWall));
      const rawTarget = continuousEnd - LIVE_EDGE_CUSHION_SECONDS;
      return Math.max(range.start, Math.min(range.end - 2, rawTarget));
    }

    function computeLastHourTarget(liveEmissionMs) {
      const d = new Date(liveEmissionMs);
      if (currentStation === "catinfo") {
        const mins = d.getMinutes();
        d.setMinutes(mins >= 30 ? 30 : 0, 0, 0);
        // Si estem als primers 60 segons d'una roda (:00 o :30), permetem saltar a la roda anterior (-30 min)
        if (liveEmissionMs - d.getTime() < 60 * 1000) {
          d.setMinutes(d.getMinutes() - 30);
        }
        return d;
      }
      d.setMinutes(0, 0, 0);
      // Si estem als primers 90 segons d'una hora en punt, permetem saltar a l'hora en punt anterior
      if (liveEmissionMs - d.getTime() < 90 * 1000) {
        d.setHours(d.getHours() - 1);
      }
      return d;
    }

    function updateThumbBubblePosition(pctNumber) {
      const clamped = Math.min(100, Math.max(0, Number(pctNumber) || 0));
      const offsetPx = ((50 - clamped) * 0.2).toFixed(2);
      if (scrubberWrap) {
        scrubberWrap.style.setProperty("--thumb-left", `calc(${clamped.toFixed(2)}% + ${offsetPx}px)`);
      }
    }

    function setScrubberProgress(pctNumber) {
      const clamped = Math.min(100, Math.max(0, Number(pctNumber) || 0));
      scrubber.value = clamped.toFixed(1);
      scrubber.style.setProperty("--scrub-progress", `${clamped.toFixed(1)}%`);
      updateThumbBubblePosition(clamped);
    }

    function formatLagBubbleText(lagSeconds) {
      if (lagSeconds > 2) {
        const mins = Math.floor(lagSeconds / 60);
        const secs = lagSeconds % 60;
        return mins > 0 ? `-${mins}m ${secs}s` : `-${secs}s`;
      }
      return "Directe";
    }

    function showLagBubbleTemporarily(durationMs = 1350) {
      if (!isTimeshiftSupported()) return;
      if (lagBubbleHideTimer) {
        clearTimeout(lagBubbleHideTimer);
        lagBubbleHideTimer = null;
      }
      lagTag.classList.add("is-visible");
      if (!isScrubbing) {
        lagBubbleHideTimer = setTimeout(() => {
          if (!isScrubbing) {
            lagTag.classList.remove("is-visible");
          }
          lagBubbleHideTimer = null;
        }, durationMs);
      }
    }

    function triggerSeekAnimation(direction, btnElement = null) {
      showLagBubbleTemporarily(1400);
      scrubber.classList.add("seek-pulse");
      if (seekPulseTimer) clearTimeout(seekPulseTimer);
      seekPulseTimer = setTimeout(() => {
        scrubber.classList.remove("seek-pulse");
      }, 280);

      if (clockDisplay) {
        clockDisplay.classList.remove("seek-nudge-left", "seek-nudge-right");
        void clockDisplay.offsetWidth;
        clockDisplay.classList.add(direction === "back" ? "seek-nudge-left" : "seek-nudge-right");
      }

      if (btnElement) {
        const animClass = direction === "back" ? "skip-anim-back" : "skip-anim-fwd";
        btnElement.classList.remove("skip-anim-back", "skip-anim-fwd");
        void btnElement.offsetWidth;
        btnElement.classList.add(animClass);
      }
    }

    function updateAnalogClockHands(dateObj, hourHandEl, minuteHandEl) {
      if (!dateObj || !hourHandEl || !minuteHandEl) return;
      const h = dateObj.getHours() % 12;
      const m = dateObj.getMinutes();
      const s = dateObj.getSeconds();
      const hourDeg = (h * 30) + (m * 0.5) + (s * (0.5 / 60));
      const minDeg = (m * 6) + (s * 0.1);
      hourHandEl.setAttribute("transform", `rotate(${hourDeg.toFixed(1)} 12 12)`);
      minuteHandEl.setAttribute("transform", `rotate(${minDeg.toFixed(1)} 12 12)`);
    }

    function getDvrWindowSeconds(range) {
      if (!range) return 7200;
      const safeLiveEnd = getSafeLiveTarget(range);
      return Math.max(60, Math.round(safeLiveEnd - range.start));
    }

    function updateDvrClockUI() {
      if (!isTimeshiftSupported()) return;

      const range = getSeekableRange();
      const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);

      if (pausedAtEmissionMs !== null && !isPlaying) {
        const maxSpan = getDvrWindowSeconds(range);
        currentLagSeconds = Math.min(maxSpan, Math.max(0, Math.round((liveEmissionMs - pausedAtEmissionMs) / 1000)));
      }

      const lagSeconds = Math.max(0, Math.round(currentLagSeconds));

      if (!isScrubbing) {
        if (lagSeconds <= 2 || !range) {
          setScrubberProgress(100);
        } else {
          const totalSpan = getDvrWindowSeconds(range);
          const pct = Math.min(100, Math.max(0, (1 - (lagSeconds / totalSpan)) * 100));
          setScrubberProgress(pct);
        }
      }

      const lastHourDate = computeLastHourTarget(liveEmissionMs);
      if (hourJumpLabel) {
        hourJumpLabel.textContent = lastHourDate.toLocaleTimeString("ca-ES", { hour: "2-digit", minute: "2-digit" });
      }
      updateAnalogClockHands(lastHourDate, hourBtnHourHand, hourBtnMinuteHand);
      if (hourJumpBtn) {
        const labelHint = currentStation === "catinfo" ? "Anar a l'inici de l'última roda" : "Anar a l'última hora en punt";
        hourJumpBtn.title = labelHint;
        hourJumpBtn.setAttribute("aria-label", labelHint);
      }

      const emissionTimestamp = (pausedAtEmissionMs !== null && !isPlaying)
        ? pausedAtEmissionMs
        : (liveEmissionMs - (lagSeconds * 1000));
      const emissionDate = new Date(emissionTimestamp);
      listeningClock.textContent = formatCatalanTime(emissionDate);
      updateAnalogClockHands(emissionDate, clockHourHand, clockMinuteHand);
      updateProgramForTimestamp(emissionTimestamp, lagSeconds > 15);

      lagTag.textContent = formatLagBubbleText(lagSeconds);
      if (lagSeconds > 4) {
        liveJumpBtn.classList.add("is-behind");
      } else {
        liveJumpBtn.classList.remove("is-behind");
      }
    }

    function updateArtworkScale() {
      if (!artworkWrapper) return;
      const shouldShrink = !isPlaying || isScrubbing;
      artworkWrapper.classList.toggle("is-shrunk", shouldShrink);
    }

    function setLoading(loading) {
      spinner.style.display = loading ? "block" : "none";
      playBtn.style.display = loading ? "none" : "flex";
    }

    function setPlayingState(playing) {
      const changed = isPlaying !== playing;
      if (playing && pausedAtEmissionMs !== null) {
        const range = getSeekableRange();
        const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);
        const maxSpan = getDvrWindowSeconds(range);
        currentLagSeconds = Math.min(maxSpan, Math.max(0, Math.round((liveEmissionMs - pausedAtEmissionMs) / 1000)));
        pausedAtEmissionMs = null;
      }
      isPlaying = playing;
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
      updateArtworkScale();
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = playing ? "playing" : "paused";
      }
      if (changed) {
        updateDvrClockUI();
      }
    }

    function restorePausedPositionIfNeeded() {
      if (pendingResumeTargetTime === null || !isTimeshiftSupported()) return;
      const target = pendingResumeTargetTime;
      const range = getSeekableRange();
      if (range && target > 0) {
        const clampedTarget = Math.max(range.start, Math.min(getSafeLiveTarget(range), target));
        if (Math.abs(audio.currentTime - clampedTarget) > 1.5) {
          try { audio.currentTime = clampedTarget; } catch (e) {}
        }
      }
      pendingResumeTargetTime = null;
    }

    async function startPlayback(forceReload = false) {
      const baseUrl = getStreamUrl();
      statusMsg.textContent = "";
      userWantedPlaying = true;
      manualPauseRequested = false;
      wasInterruptedExternally = false;

      // Si ja tenim el mateix flux carregat i no és una reconnexió forçada, reprenem al punt exacte on s'havia pausat
      if (!forceReload && activeStreamUrl === baseUrl && (audio.src || hlsInstance)) {
        pendingResumeTargetTime = pausedAudioCurrentTime;
        try {
          if (hlsInstance) {
            try { hlsInstance.startLoad(); } catch (e) {}
          }
          await audio.play();
          restorePausedPositionIfNeeded();
          pausedAudioCurrentTime = null;
          setPlayingState(true);
          return;
        } catch (err) {}
      }

      setLoading(true);
      currentLagSeconds = 0;
      pausedAtEmissionMs = null;
      pausedAudioCurrentTime = null;
      pendingResumeTargetTime = null;
      peakMediaMinusWall = null;
      initialLiveCushionApplied = false;
      streamLoadTimestamp = Date.now();
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const streamUrl = baseUrl;
      activeStreamUrl = baseUrl;

      const isAutoplayBlockedError = (err) => {
        if (!err) return false;
        const name = String(err.name || "");
        const msg = String(err.message || "");
        return name === "NotAllowedError" || name === "AbortError" || /notallowed|interaction|gesture|permission/i.test(msg);
      };

      if ("audioSession" in navigator && navigator.audioSession) {
        try { navigator.audioSession.type = "playback"; } catch (e) {}
      }

      const isNativeHls = audio.canPlayType("application/vnd.apple.mpegurl") !== "";

      // Prioritzem Hls.js (ManagedMediaSource a iOS 17.1+ / MSE) sense liveMaxLatencyDurationCount perquè mai salti sol al directe en reprendre de pausa
      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          backBufferLength: 7200,
          maxBufferLength: 600,
          liveSyncDurationCount: 4,
          liveMaxLatencyDurationCount: Infinity
        });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(audio);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, async () => {
          try {
            await audio.play();
            autoplayPending = false;
            setLoading(false);
            setPlayingState(true);
          } catch (err) {
            autoplayPending = true;
            setLoading(false);
            setPlayingState(false);
          }
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            hlsInstance.destroy();
            hlsInstance = null;
            // Si falla ManagedMediaSource (ex. en activar AirPlay o xarxa), passem al motor HLS natiu o MP3
            audio.src = isNativeHls ? streamUrl : STREAMS[currentStation].fallbackMp3;
            audio.play().then(() => {
              autoplayPending = false;
              setLoading(false);
              setPlayingState(true);
            }).catch((err2) => {
              if (isAutoplayBlockedError(err2)) {
                autoplayPending = true;
                setLoading(false);
                setPlayingState(false);
                return;
              }
              setLoading(false);
              setPlayingState(false);
              statusMsg.textContent = "Error de connexió amb el directe";
            });
          }
        });
      } else if (isNativeHls) {
        audio.src = streamUrl;
        audio.load();
        try {
          await audio.play();
          autoplayPending = false;
          setLoading(false);
          setPlayingState(true);
        } catch (err) {
          if (isAutoplayBlockedError(err)) {
            autoplayPending = true;
            setLoading(false);
            setPlayingState(false);
            return;
          }
          audio.src = STREAMS[currentStation].fallbackMp3;
          try {
            await audio.play();
            autoplayPending = false;
            setLoading(false);
            setPlayingState(true);
          } catch (e2) {
            autoplayPending = true;
            setLoading(false);
            setPlayingState(false);
          }
        }
      } else {
        audio.src = STREAMS[currentStation].fallbackMp3;
        audio.play().then(() => {
          autoplayPending = false;
          setLoading(false);
          setPlayingState(true);
        }).catch(() => {
          autoplayPending = true;
          setLoading(false);
          setPlayingState(false);
        });
      }
    }

    function pausePlayback() {
      if (isPlaying && pausedAtEmissionMs === null) {
        pausedAtEmissionMs = Date.now() - ((STREAM_DELAY_SECONDS + currentLagSeconds) * 1000);
      }
      if (audio.currentTime > 0) {
        pausedAudioCurrentTime = audio.currentTime;
      }
      userWantedPlaying = false;
      manualPauseRequested = true;
      wasInterruptedExternally = false;
      resumeSavedTime = null;
      audio.pause();
      setPlayingState(false);
      setTimeout(() => { manualPauseRequested = false; }, 400);
    }

    // Controls des de la pantalla bloquejada i auriculars d'iOS
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => {
        userWantedPlaying = true;
        manualPauseRequested = false;
        wasInterruptedExternally = false;
        startPlayback(false);
      });

      navigator.mediaSession.setActionHandler("pause", () => {
        pausePlayback();
      });

      navigator.mediaSession.setActionHandler("seekbackward", (details) => {
        if (!isTimeshiftSupported()) return;
        initialLiveCushionApplied = true;
        const offset = details.seekOffset || 10;
        const range = getSeekableRange();
        if (range) {
          const maxSpan = getDvrWindowSeconds(range);
          currentLagSeconds = Math.min(maxSpan, currentLagSeconds + offset);
          if (pausedAtEmissionMs !== null) pausedAtEmissionMs -= offset * 1000;
          audio.currentTime = Math.max(range.start, audio.currentTime - offset);
          updateDvrClockUI();
        }
      });

      navigator.mediaSession.setActionHandler("seekforward", (details) => {
        if (!isTimeshiftSupported()) return;
        initialLiveCushionApplied = true;
        const offset = details.seekOffset || 10;
        const range = getSeekableRange();
        if (range) {
          const safeLiveEnd = getSafeLiveTarget(range);
          const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);
          currentLagSeconds = Math.max(0, currentLagSeconds - offset);
          if (pausedAtEmissionMs !== null) {
            pausedAtEmissionMs = Math.min(liveEmissionMs, pausedAtEmissionMs + offset * 1000);
          }
          audio.currentTime = Math.min(safeLiveEnd, audio.currentTime + offset);
          updateDvrClockUI();
        }
      });
    }

    // Aplica el coixí anti-talls una única vegada durant l'arrencada inicial del canal (mai mentre l'usuari ja escolta)
    function applyInitialLiveCushionIfNeeded() {
      if (initialLiveCushionApplied || !isTimeshiftSupported()) return;
      if (Date.now() - streamLoadTimestamp > 3500) {
        initialLiveCushionApplied = true;
        return;
      }
      const range = getSeekableRange();
      if (range && range.end - range.start > 30) {
        initialLiveCushionApplied = true;
        const safeLiveEnd = getSafeLiveTarget(range);
        if (range.end - audio.currentTime < LIVE_EDGE_CUSHION_SECONDS - 2) {
          try { audio.currentTime = safeLiveEnd; } catch (e) {}
        }
      }
    }

    // Esdeveniments d'àudio natius (sincronitza estat, aplica coixí anti-talls a l'inici i reprèn després d'interrupcions com WhatsApp)
    const tryPendingAutoplay = () => {
      if (!autoplayPending || isPlaying || manualPauseRequested || !(audio.src || hlsInstance)) return;
      audio.play().then(() => {
        autoplayPending = false;
        setLoading(false);
        setPlayingState(true);
      }).catch(() => {});
    };

    audio.addEventListener("loadedmetadata", () => {
      applyInitialLiveCushionIfNeeded();
      tryPendingAutoplay();
    });
    audio.addEventListener("canplay", () => {
      applyInitialLiveCushionIfNeeded();
      tryPendingAutoplay();
    });
    audio.addEventListener("play", () => {
      autoplayPending = false;
      setPlayingState(true);
    });
    audio.addEventListener("pause", () => {
      if (pausedAtEmissionMs === null) {
        pausedAtEmissionMs = Date.now() - ((STREAM_DELAY_SECONDS + currentLagSeconds) * 1000);
      }
      if (audio.currentTime > 0) {
        pausedAudioCurrentTime = audio.currentTime;
      }
      if (!manualPauseRequested && userWantedPlaying) {
        // Interrupció externa d'iOS (ex. àudio de WhatsApp o trucada): guardem el segon exacte per reprendre quan acabi
        wasInterruptedExternally = true;
        resumeSavedTime = audio.currentTime;
      }
      setPlayingState(false);
    });
    audio.addEventListener("playing", () => {
      setLoading(false);
      wasInterruptedExternally = false;
      statusMsg.textContent = "";
      restorePausedPositionIfNeeded();
      applyInitialLiveCushionIfNeeded();
    });
    audio.addEventListener("timeupdate", () => {
      if (!initialLiveCushionApplied) {
        applyInitialLiveCushionIfNeeded();
      }
    });

    // Quan s'acaba l'àudio de WhatsApp i tornem a la pantalla o el sistema allibera l'àudio, reprenem on s'havia quedat
    const tryAutoResumeAfterInterruption = () => {
      if (!userWantedPlaying || !wasInterruptedExternally || !audio.paused || !(audio.src || hlsInstance)) return;
      const targetTime = resumeSavedTime;
      audio.play().then(() => {
        wasInterruptedExternally = false;
        setPlayingState(true);
        if (targetTime && targetTime > 0 && isTimeshiftSupported()) {
          const range = getSeekableRange();
          if (range && targetTime >= range.start && targetTime <= range.end && Math.abs(audio.currentTime - targetTime) > 2) {
            try { audio.currentTime = targetTime; } catch (e) {}
          }
        }
        resumeSavedTime = null;
        updateDvrClockUI();
      }).catch(() => {});
    };

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        tryAutoResumeAfterInterruption();
      }
    });
    window.addEventListener("focus", tryAutoResumeAfterInterruption);
    window.addEventListener("pageshow", tryAutoResumeAfterInterruption);
    setInterval(() => {
      if (userWantedPlaying && wasInterruptedExternally && audio.paused && document.visibilityState === "visible") {
        tryAutoResumeAfterInterruption();
      }
    }, 2500);
    audio.addEventListener("waiting", () => {
      if (isPlaying) statusMsg.textContent = "Carregant àudio...";
    });

    // Botó principal Play / Pause
    playBtn.addEventListener("click", () => {
      // Evita que el primer toc que desbloqueja l'autoplay pausi l'àudio uns mil·lisegons després
      if (Date.now() - lastAutoplayUnlockMs < 550) return;
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback(false);
      }
    });

    // Botons -10s i +10s
    back10Btn.addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      initialLiveCushionApplied = true;
      const range = getSeekableRange();
      if (!range) return;
      const maxSpan = getDvrWindowSeconds(range);
      currentLagSeconds = Math.min(maxSpan, currentLagSeconds + 10);
      if (pausedAtEmissionMs !== null) {
        pausedAtEmissionMs -= 10000;
      }
      audio.currentTime = Math.max(range.start, audio.currentTime - 10);
      updateDvrClockUI();
      triggerSeekAnimation("back", back10Btn);
    });

    fwd10Btn.addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      initialLiveCushionApplied = true;
      const range = getSeekableRange();
      if (!range) return;
      const safeLiveEnd = getSafeLiveTarget(range);
      const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);
      currentLagSeconds = Math.max(0, currentLagSeconds - 10);
      if (pausedAtEmissionMs !== null) {
        pausedAtEmissionMs = Math.min(liveEmissionMs, pausedAtEmissionMs + 10000);
      }
      audio.currentTime = Math.min(safeLiveEnd, audio.currentTime + 10);
      updateDvrClockUI();
      triggerSeekAnimation("fwd", fwd10Btn);
    });

    // Saltar a l'última hora en punt (o inici d'última roda a 3CatInfo)
    hourJumpBtn.addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      initialLiveCushionApplied = true;
      const range = getSeekableRange();
      if (!range) return;
      const safeLiveEnd = getSafeLiveTarget(range);
      const maxSpan = getDvrWindowSeconds(range);
      const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);
      const lastHourDate = computeLastHourTarget(liveEmissionMs);
      const secondsSinceLastHour = Math.max(0, Math.round((liveEmissionMs - lastHourDate.getTime()) / 1000));
      currentLagSeconds = Math.min(maxSpan, secondsSinceLastHour);
      pausedAtEmissionMs = null;
      const targetAudioTime = Math.max(range.start, Math.min(safeLiveEnd, safeLiveEnd - currentLagSeconds));
      audio.currentTime = targetAudioTime;
      if (!isPlaying) {
        startPlayback(false);
      }
      updateDvrClockUI();
      triggerSeekAnimation("back");
    });

    // Saltar de nou al directe viu (amb coixí anti-talls)
    liveJumpBtn.addEventListener("click", () => {
      initialLiveCushionApplied = true;
      currentLagSeconds = 0;
      pausedAtEmissionMs = null;
      const range = getSeekableRange();
      if (range) {
        const safeLiveEnd = getSafeLiveTarget(range);
        audio.currentTime = safeLiveEnd;
        if (!isPlaying) {
          startPlayback(false);
        }
        updateDvrClockUI();
        triggerSeekAnimation("fwd");
      } else {
        startPlayback(true);
      }
    });

    // Interacció tàctil fluida amb la barra de Timeshift
    const beginScrub = () => {
      if (!isTimeshiftSupported()) return;
      initialLiveCushionApplied = true;
      isScrubbing = true;
      updateArtworkScale();
      scrubWindowSeconds = getDvrWindowSeconds(getSeekableRange());
      nextPill.classList.remove("is-visible");
      if (lagBubbleHideTimer) {
        clearTimeout(lagBubbleHideTimer);
        lagBubbleHideTimer = null;
      }
      lagTag.classList.add("is-visible");
    };

    const previewScrub = () => {
      const rawPct = Math.min(100, Math.max(0, parseFloat(scrubber.value) || 0));
      scrubber.style.setProperty("--scrub-progress", `${rawPct.toFixed(1)}%`);
      updateThumbBubblePosition(rawPct);
      if (!isTimeshiftSupported() || !isScrubbing) return;
      lagTag.classList.add("is-visible");
      const pct = rawPct / 100;
      const lagSeconds = Math.max(0, Math.round((1 - pct) * scrubWindowSeconds));
      const range = getSeekableRange();
      const liveEmissionMs = Date.now() - (STREAM_DELAY_SECONDS * 1000);
      const emissionTimestamp = liveEmissionMs - (lagSeconds * 1000);
      const emissionDate = new Date(emissionTimestamp);
      listeningClock.textContent = formatCatalanTime(emissionDate);
      updateAnalogClockHands(emissionDate, clockHourHand, clockMinuteHand);
      updateProgramForTimestamp(emissionTimestamp, lagSeconds > 15);
      lagTag.textContent = formatLagBubbleText(lagSeconds);
      if (lagSeconds > 4) {
        liveJumpBtn.classList.add("is-behind");
      } else {
        liveJumpBtn.classList.remove("is-behind");
      }
    };

    const commitScrub = () => {
      if (!isScrubbing) return;
      isScrubbing = false;
      updateArtworkScale();
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (!range) {
        lagTag.classList.remove("is-visible");
        return;
      }
      const safeLiveEnd = getSafeLiveTarget(range);
      const pct = Math.min(1, Math.max(0, (parseFloat(scrubber.value) || 0) / 100));
      currentLagSeconds = Math.max(0, Math.round((1 - pct) * scrubWindowSeconds));
      pausedAtEmissionMs = null;
      const targetTime = safeLiveEnd - currentLagSeconds;
      audio.currentTime = Math.min(safeLiveEnd, Math.max(range.start, targetTime));
      updateDvrClockUI();
      showLagBubbleTemporarily(950);
    };

    scrubber.addEventListener("pointerdown", beginScrub);
    scrubber.addEventListener("touchstart", beginScrub, { passive: true });
    scrubber.addEventListener("input", previewScrub);
    scrubber.addEventListener("change", commitScrub);
    scrubber.addEventListener("pointerup", commitScrub);
    scrubber.addEventListener("touchend", commitScrub);
    scrubber.addEventListener("pointercancel", commitScrub);
    scrubber.addEventListener("touchcancel", commitScrub);

    // Selector d'emissores amb lliscament horitzontal tàctil i interpolació del color
    function hexToRgb(hex) {
      const clean = String(hex || "#FFD100").replace("#", "");
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function lerpHexColor(hexA, hexB, t) {
      const [r1, g1, b1] = hexToRgb(hexA);
      const [r2, g2, b2] = hexToRgb(hexB);
      const f = Math.min(1, Math.max(0, t));
      const r = Math.round(r1 + (r2 - r1) * f);
      const g = Math.round(g1 + (g2 - g1) * f);
      const b = Math.round(b1 + (b2 - b1) * f);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function applyStationThemeAndMetadata(newId, shouldStartAudio) {
      const changedStation = newId !== currentStation;
      currentStation = newId;
      document.querySelectorAll(".station-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.id === newId);
      });
      document.documentElement.style.setProperty("--ambient-color", STREAMS[currentStation].ambient);
      document.documentElement.style.setProperty("--accent-color", STREAMS[currentStation].accent);
      playBtn.classList.toggle("light-icon", ["catinfo", "icat", "catmusica"].includes(currentStation));
      territorialRow.style.visibility = currentStation === "catradio" ? "visible" : "hidden";

      if (changedStation) {
        lastStationSwitchTimestamp = Date.now();
        if (nextPill) {
          nextPill.classList.remove("is-visible");
          nextPill.textContent = "";
        }
        currentLagSeconds = 0;
        pausedAtEmissionMs = null;
        liveChannelData = allChannelsData?.[currentStation] || null;
        lastRenderedProgramKey = "";
        updateTimeshiftVisibility();
        updateDvrClockUI();

        if (currentStation === "icat") {
          fetchIcatNowPlaying();
          if (!icatPollTimer) {
            icatPollTimer = setInterval(fetchIcatNowPlaying, 20000);
          }
        } else if (icatPollTimer) {
          clearInterval(icatPollTimer);
          icatPollTimer = null;
        }
      }

      if (shouldStartAudio) {
        lastStationSwitchTimestamp = Date.now();
        if (nextPill) {
          nextPill.classList.remove("is-visible");
          nextPill.textContent = "";
        }
        updateStationPillToCurrent();
        fetchLiveProgramMetadata();
        startPlayback(true);
      }
    }

    let stationDragState = null;
    let lastCommittedStation = currentStation;

    function getPointerGridRelX(clientX) {
      if (!stationsGrid) return 0;
      const rect = stationsGrid.getBoundingClientRect();
      return clientX - rect.left;
    }

    function updateStationDragAtPosition(clientX, clientY) {
      if (!stationsGrid || !stationSliderPill) return;
      const btns = Array.from(stationsGrid.querySelectorAll(".station-btn"));
      if (btns.length === 0) return;

      const btnW = btns[0].offsetWidth;
      const btnH = btns[0].offsetHeight;
      const minX = btns[0].offsetLeft;
      const maxX = btns[btns.length - 1].offsetLeft;
      const relX = getPointerGridRelX(clientX);
      const clampedX = Math.max(minX, Math.min(maxX, relX - btnW / 2));

      let segIdx = 0;
      for (let i = 0; i < btns.length - 1; i++) {
        if (clampedX >= btns[i].offsetLeft && clampedX <= btns[i + 1].offsetLeft) {
          segIdx = i;
          break;
        }
      }
      const leftBtn = btns[segIdx];
      const rightBtn = btns[Math.min(btns.length - 1, segIdx + 1)];
      const span = Math.max(1, rightBtn.offsetLeft - leftBtn.offsetLeft);
      const t = Math.min(1, Math.max(0, (clampedX - leftBtn.offsetLeft) / span));
      const nearestBtn = t < 0.5 ? leftBtn : rightBtn;
      const nearestId = nearestBtn.dataset.id;

      const blendedColor = lerpHexColor(
        STREAMS[leftBtn.dataset.id].accent,
        STREAMS[rightBtn.dataset.id].accent,
        t
      );

      stationSliderPill.classList.add("is-dragging");
      stationSliderPill.style.setProperty("--pill-w", `${btnW}px`);
      stationSliderPill.style.setProperty("--pill-h", `${btnH}px`);
      stationSliderPill.style.setProperty("--pill-x", `${clampedX.toFixed(1)}px`);
      stationSliderPill.style.setProperty("--pill-color", blendedColor);

      if (nearestId !== currentStation) {
        applyStationThemeAndMetadata(nearestId, false);
      }
    }

    if (stationsGrid) {
      stationsGrid.addEventListener("pointerdown", (e) => {
        const tappedBtn = e.target.closest(".station-btn");
        stationDragState = {
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          hasMoved: false,
          tappedId: tappedBtn ? tappedBtn.dataset.id : null
        };
        try { stationsGrid.setPointerCapture(e.pointerId); } catch (err) {}
      });

      stationsGrid.addEventListener("pointermove", (e) => {
        if (!stationDragState || e.pointerId !== stationDragState.pointerId) return;
        const dist = Math.hypot(e.clientX - stationDragState.startX, e.clientY - stationDragState.startY);
        if (!stationDragState.hasMoved && dist > 4) {
          stationDragState.hasMoved = true;
        }
        if (stationDragState.hasMoved) {
          updateStationDragAtPosition(e.clientX, e.clientY);
        }
      });

      const finishStationPointer = (e) => {
        if (!stationDragState || (e.pointerId !== undefined && e.pointerId !== stationDragState.pointerId)) return;
        const wasDragged = stationDragState.hasMoved;
        const tappedId = stationDragState.tappedId;
        stationDragState = null;

        if (!wasDragged && tappedId) {
          if (tappedId !== lastCommittedStation || tappedId !== currentStation) {
            lastStationSwitchTimestamp = Date.now();
            if (nextPill) {
              nextPill.classList.remove("is-visible");
              nextPill.textContent = "";
            }
            lastCommittedStation = tappedId;
            applyStationThemeAndMetadata(tappedId, true);
          } else {
            updateStationPillToCurrent();
          }
          return;
        }

        updateStationPillToCurrent();
        if (currentStation !== lastCommittedStation) {
          lastStationSwitchTimestamp = Date.now();
          if (nextPill) {
            nextPill.classList.remove("is-visible");
            nextPill.textContent = "";
          }
          lastCommittedStation = currentStation;
          fetchLiveProgramMetadata();
          startPlayback(true);
        }
      };

      stationsGrid.addEventListener("pointerup", finishStationPointer);
      stationsGrid.addEventListener("pointercancel", finishStationPointer);
    }

    // Selector de connexió territorial (Barcelona, Girona, Lleida, Tarragona)
    territorialSelect.addEventListener("change", () => {
      lastStationSwitchTimestamp = Date.now();
      if (nextPill) {
        nextPill.classList.remove("is-visible");
        nextPill.textContent = "";
      }
      currentLagSeconds = 0;
      pausedAtEmissionMs = null;
      lastRenderedProgramKey = "";
      updateTimeshiftVisibility();
      updateDvrClockUI();
      fetchLiveProgramMetadata();
      startPlayback(true);
    });

    // Inicialització
    updateStationPillToCurrent();
    updateTimeshiftVisibility();
    fetchLiveProgramMetadata();
    updateDvrClockUI();
    if (currentStation === "icat") {
      fetchIcatNowPlaying();
      if (!icatPollTimer) icatPollTimer = setInterval(fetchIcatNowPlaying, 20000);
    }

    // Amaga la pantalla d'inici (splash screen) i reintenta autoplay en acabar la transició
    let autoplayPending = true;
    const splashScreen = document.getElementById("splashScreen");
    if (splashScreen) {
      setTimeout(() => {
        splashScreen.classList.add("splash-hide");
        tryPendingAutoplay();
        setTimeout(() => {
          splashScreen.remove();
          tryPendingAutoplay();
        }, 350);
      }, 1250);
    }

    clockTimer = setInterval(updateDvrClockUI, 250);
    metadataTimer = setInterval(fetchLiveProgramMetadata, 45000);

    // Intenta reproduir automàticament en entrar a la webapp
    startPlayback(false).then(() => {
      if (isPlaying) autoplayPending = false;
    });

    // Si iOS bloqueja l'autoplay fins al primer gest, arrenca al primer toc a qualsevol punt (sense cancel·lar els listeners fins que soni de debò)
    const unlockAutoplayOnFirstGesture = () => {
      if (!autoplayPending || isPlaying) {
        if (isPlaying) {
          document.removeEventListener("pointerup", unlockAutoplayOnFirstGesture, true);
          document.removeEventListener("touchend", unlockAutoplayOnFirstGesture, true);
          document.removeEventListener("click", unlockAutoplayOnFirstGesture, true);
        }
        return;
      }
      lastAutoplayUnlockMs = Date.now();
      if (audio.src || hlsInstance) {
        audio.play().then(() => {
          autoplayPending = false;
          setLoading(false);
          setPlayingState(true);
          snapClockToPlayhead();
          document.removeEventListener("pointerup", unlockAutoplayOnFirstGesture, true);
          document.removeEventListener("touchend", unlockAutoplayOnFirstGesture, true);
          document.removeEventListener("click", unlockAutoplayOnFirstGesture, true);
        }).catch(() => {
          startPlayback(false);
        });
      } else {
        startPlayback(false);
      }
    };
    document.addEventListener("pointerup", unlockAutoplayOnFirstGesture, true);
    document.addEventListener("touchend", unlockAutoplayOnFirstGesture, true);
    document.addEventListener("click", unlockAutoplayOnFirstGesture, true);
  </script>
</body>
</html>
