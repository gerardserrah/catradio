<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CatRàdio" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <title>CatRàdio Directe</title>
  <!-- hls.js per permetre Timeshift/DVR i memòria cau llarga en navegadors no-Safari -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

  <style>
    @font-face {
      font-family: "Bw3Cat-Regular";
      src: url("/fonts/Bw3Cat-Regular.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Regular.woff") format("woff"),
           url("/fonts/Bw3Cat-Regular.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bw3Cat-Bold";
      src: url("/fonts/Bw3Cat-Bold.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Bold.woff") format("woff"),
           url("/fonts/Bw3Cat-Bold.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bw3Cat-Black";
      src: url("/fonts/Bw3Cat-Black.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Black.woff") format("woff"),
           url("/fonts/Bw3Cat-Black.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Black.otf") format("opentype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-main: "Bw3Cat-Regular", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-bold: "Bw3Cat-Bold", var(--font-main);
      --font-black: "Bw3Cat-Black", var(--font-main);
      --bg: #0a0a0a;
      --card-bg: #141414;
      --border: #262626;
      --yellow: #ffd100;
      --text: #ffffff;
      --muted: #9ca3af;
      --ambient-color: rgba(255, 209, 0, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, var(--ambient-color) 0%, #0a0a0a 68%);
      transition: background 0.5s ease;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 10px) 20px calc(env(safe-area-inset-bottom, 20px) + 12px) 20px;
    }

    /* Capçalera neta */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-bold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Graella de 5 emissores oficials */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .station-btn {
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .station-btn:active {
      transform: scale(0.95);
    }

    .station-btn img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      filter: brightness(0) invert(1);
      pointer-events: none;
    }

    /* Colors actius oficials per emissora */
    .station-btn[data-id="catradio"].active {
      background: #FFD100;
      border-color: #FFD100;
    }
    .station-btn[data-id="catradio"].active img {
      filter: brightness(0);
    }

    .station-btn[data-id="digital"].active {
      background: #F5A800;
      border-color: #F5A800;
    }
    .station-btn[data-id="digital"].active img {
      filter: brightness(0);
    }

    .station-btn[data-id="catinfo"].active {
      background: #F25400;
      border-color: #F25400;
    }

    .station-btn[data-id="icat"].active {
      background: #C4162A;
      border-color: #C4162A;
    }

    .station-btn[data-id="catmusica"].active {
      background: #429B2B;
      border-color: #429B2B;
    }

    /* Connexió territorial */
    .territorial-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 13px;
      color: #e5e7eb;
    }

    .territorial-select {
      background: transparent;
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 2px;
      outline: none;
      cursor: pointer;
    }

    .territorial-select option {
      background: #141414;
      color: #ffffff;
    }

    .territorial-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid #6b7280;
      border-radius: 50%;
      font-size: 11px;
      color: #d1d5db;
    }

    /* Zona central (Portada i Programa) */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      padding: 8px 0;
    }

    .artwork-wrapper {
      position: relative;
      width: 215px;
      height: 215px;
      border-radius: 8px;
      background: #121212;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.75);
      margin-bottom: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .artwork.is-logo-fallback {
      width: 58%;
      height: 58%;
      object-fit: contain;
      filter: brightness(0) invert(1) opacity(0.35);
    }

    .program-title {
      font-family: var(--font-black);
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .program-host {
      font-size: 14px;
      color: #d1d5db;
      margin: 0;
      line-height: 1.35;
    }

    .next-pill {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 12px;
      border-radius: 999px;
      max-width: 92%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }

    /* Barra de Timeshift / Rellotge */
    .timeshift-box {
      width: 100%;
      margin-bottom: 14px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      color: #d1d5db;
    }

    .lag-tag {
      color: var(--yellow);
      font-weight: 600;
      margin-left: 6px;
    }

    .scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      outline: none;
      cursor: pointer;
      touch-action: none;
      margin: 0;
    }

    .scrubber::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      background: #2f2f2f;
      border-radius: 999px;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      margin-top: -7.5px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .scrubber:active::-webkit-slider-thumb {
      transform: scale(1.25);
      background: var(--yellow);
    }

    /* Botons de control de reproducció */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 8px;
    }

    .timeshift-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .skip-btn:active {
      background: #262626;
    }

    .live-jump-btn {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .play-wrapper {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      transition: transform 0.12s ease;
    }

    .play-btn:active {
      transform: scale(0.93);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-msg {
      font-size: 12px;
      color: var(--yellow);
      text-align: center;
      min-height: 16px;
      margin-bottom: 4px;
    }

    /* Peu amb reconnexió */
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div>
      <!-- Capçalera neta -->
      <div class="header">
        <div class="live-badge">
          <span class="dot"></span>
          <span>EN DIRECTE</span>
        </div>
      </div>

      <!-- Selector dels 5 canals oficials -->
      <div class="stations-grid" id="stationsGrid">
        <button class="station-btn active" data-id="catradio" aria-label="Catalunya Ràdio">
          <img src="https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg" alt="Catràdio" />
        </button>
        <button class="station-btn" data-id="digital" aria-label="Exclusiu Digital">
          <img src="https://statics.3cat.cat/recursos/3cat/logos/web/ocr1.svg" onerror="this.src='https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg'" alt="Exclusiu Digital" />
        </button>
        <button class="station-btn" data-id="catinfo" aria-label="3CatInfo">
          <img src="https://statics.3cat.cat/recursos/3cat/logos/web/ci.svg" onerror="this.src='https://statics.3cat.cat/recursos/3cat/logos/web/3catinfo.svg'" alt="3cat info" />
        </button>
        <button class="station-btn" data-id="icat" aria-label="iCat">
          <img src="https://statics.3cat.cat/recursos/3cat/logos/web/ic.svg?v=3.2611.1" alt="iCat" />
        </button>
        <button class="station-btn" data-id="catmusica" aria-label="CatMúsica">
          <img src="https://statics.3cat.cat/recursos/3cat/logos/web/cm.svg?v=3.2611.3" alt="CatMúsica" />
        </button>
      </div>

      <!-- Connexió territorial -->
      <div class="territorial-row" id="territorialRow">
        <span>Connexió territorial:</span>
        <select class="territorial-select" id="territorialSelect">
          <option value="barcelona" selected>Barcelona</option>
          <option value="girona">Girona</option>
          <option value="lleida">Lleida</option>
          <option value="tarragona">Tarragona</option>
        </select>
        <span class="territorial-badge">›</span>
      </div>
    </div>

    <!-- Zona central: Caràtula i títol del programa -->
    <div class="center-stage">
      <div class="artwork-wrapper">
        <img id="artwork" class="artwork is-logo-fallback" src="https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg" alt="Programa" />
      </div>
      <h1 class="program-title" id="programTitle">Catalunya Ràdio</h1>
      <p class="program-host" id="programHost">Connexió territorial: Girona</p>
      <div class="next-pill" id="nextPill"></div>
    </div>

    <!-- Controls de reproducció i Timeshift -->
    <div>
      <div class="timeshift-box" id="timeshiftBox">
        <div class="time-labels">
          <div>
            <span id="listeningClock">--:--:--</span>
            <span class="lag-tag" id="lagTag"></span>
          </div>
          <div>
            <button class="live-jump-btn" id="liveJumpBtn">• DIRECTE</button>
          </div>
        </div>
        <input type="range" class="scrubber" id="scrubber" min="0" max="100" value="100" step="0.1" />
      </div>

      <div class="controls-row">
        <button class="skip-btn" id="back10Btn">-10s</button>

        <div class="play-wrapper">
          <div class="spinner" id="spinner"></div>
          <button class="play-btn" id="playBtn" aria-label="Reproduir o pausar">
            <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
            <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
        </div>

        <button class="skip-btn" id="fwd10Btn">+10s</button>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <!-- Peu amb botó de reconnexió forçada -->
      <div class="footer">
        <button class="icon-btn" id="reconnectBtn" title="Forçar reconnexió">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Reproductor natiu HTML5 (màxima estabilitat en segon pla a iOS) -->
  <audio id="audioPlayer" preload="none" playsinline></audio>

  <script>
    const STREAMS = {
      catradio: {
        name: "Catalunya Ràdio",
        pvideoId: "cr",
        logo: "https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg",
        ambient: "rgba(255, 209, 0, 0.14)",
        urls: {
          barcelona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-hls/master.m3u8",
          girona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-girona-hls/master.m3u8",
          lleida: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-lleida-hls/master.m3u8",
          tarragona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-tarragona-hls/master.m3u8"
        },
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      digital: {
        name: "CatRàdio Exclusiu Digital",
        pvideoId: "ocr1",
        logo: "https://statics.3cat.cat/recursos/3cat/logos/web/ocr1.svg",
        ambient: "rgba(245, 168, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-digital-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      catinfo: {
        name: "3CatInfo",
        pvideoId: "ci",
        logo: "https://statics.3cat.cat/recursos/3cat/logos/web/ci.svg",
        ambient: "rgba(242, 84, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-informacio-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyainformacioHD.mp3"
      },
      icat: {
        name: "iCat",
        pvideoId: "ic",
        logo: "https://statics.3cat.cat/recursos/3cat/logos/web/ic.svg?v=3.2611.1",
        ambient: "rgba(196, 22, 42, 0.16)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/icat-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/icatHD.mp3"
      },
      catmusica: {
        name: "Catalunya Música",
        pvideoId: "cm",
        logo: "https://statics.3cat.cat/recursos/3cat/logos/web/cm.svg?v=3.2611.3",
        ambient: "rgba(66, 155, 43, 0.15)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-musica-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyamusicaHD.mp3"
      }
    };

    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const spinner = document.getElementById("spinner");
    const statusMsg = document.getElementById("statusMsg");
    const programTitle = document.getElementById("programTitle");
    const programHost = document.getElementById("programHost");
    const nextPill = document.getElementById("nextPill");
    const artwork = document.getElementById("artwork");
    const territorialRow = document.getElementById("territorialRow");
    const territorialSelect = document.getElementById("territorialSelect");
    const timeshiftBox = document.getElementById("timeshiftBox");
    const back10Btn = document.getElementById("back10Btn");
    const fwd10Btn = document.getElementById("fwd10Btn");
    const listeningClock = document.getElementById("listeningClock");
    const lagTag = document.getElementById("lagTag");
    const liveJumpBtn = document.getElementById("liveJumpBtn");
    const scrubber = document.getElementById("scrubber");

    const STREAM_DELAY_SECONDS = 10; // Compensació del retard habitual del flux HLS
    let currentStation = "catradio";
    let isPlaying = false;
    let hlsInstance = null;
    let isScrubbing = false;
    let manualLagSeconds = 0;
    let activeStreamUrl = null;
    let stallCounter = 0;
    let watchdogTimer = null;
    let clockTimer = null;
    let metadataTimer = null;
    let iosYellowLogoDataUrl = null;

    // Genera una imatge PNG quadrada 512x512 amb fons groc #FFD100 i el logo de CatRàdio en negre per a la pantalla de bloqueig d'iOS
    function buildYellowCatRadioArtwork() {
      return new Promise((resolve) => {
        if (iosYellowLogoDataUrl) {
          resolve(iosYellowLogoDataUrl);
          return;
        }
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFD100";
        ctx.fillRect(0, 0, 512, 512);

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const targetW = 340;
          const ratio = img.naturalHeight && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 0.42;
          const targetH = Math.round(targetW * ratio);
          const x = Math.round((512 - targetW) / 2);
          const y = Math.round((512 - targetH) / 2);
          ctx.filter = "brightness(0)";
          ctx.drawImage(img, x, y, targetW, targetH);
          try {
            iosYellowLogoDataUrl = canvas.toDataURL("image/png");
          } catch (e) {
            iosYellowLogoDataUrl = null;
          }
          resolve(iosYellowLogoDataUrl);
        };
        img.onerror = () => resolve(null);
        img.src = "https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg";
      });
    }

    function getStreamUrl() {
      const station = STREAMS[currentStation];
      if (currentStation === "catradio") {
        const region = territorialSelect.value;
        return station.urls[region] || station.fallbackMp3;
      }
      return station.url || station.fallbackMp3;
    }

    // Intenta obtenir la URL DVR amb token des de la funció serverless de Vercel (/api/dvr)
    async function resolveBestStreamUrl() {
      const station = STREAMS[currentStation];
      try {
        const res = await fetch(`/api/dvr?id=${encodeURIComponent(station.pvideoId)}`);
        if (res.ok) {
          const data = await res.json();
          const urlList = data?.media?.url || [];
          const hlsObj = Array.isArray(urlList)
            ? urlList.find((u) => typeof u?.file === "string" && u.file.includes(".m3u8"))
            : null;
          if (hlsObj && hlsObj.file) {
            return hlsObj.file;
          }
        }
      } catch (e) {}
      return getStreamUrl();
    }

    function setArtworkSafe(url, fallbackLogo) {
      if (url && !url.endsWith(".svg")) {
        artwork.classList.remove("is-logo-fallback");
        artwork.onerror = () => {
          artwork.onerror = null;
          artwork.classList.add("is-logo-fallback");
          artwork.src = fallbackLogo;
        };
        artwork.src = url;
      } else {
        artwork.onerror = null;
        artwork.classList.add("is-logo-fallback");
        artwork.src = fallbackLogo;
      }
    }

    function isTimeshiftSupported() {
      return !(currentStation === "catradio" && territorialSelect.value !== "barcelona");
    }

    function updateTimeshiftVisibility() {
      const supported = isTimeshiftSupported();
      timeshiftBox.classList.toggle("timeshift-hidden", !supported);
      back10Btn.classList.toggle("timeshift-hidden", !supported);
      fwd10Btn.classList.toggle("timeshift-hidden", !supported);
    }

    function updateBaseUI() {
      const station = STREAMS[currentStation];
      document.documentElement.style.setProperty("--ambient-color", station.ambient);
      programTitle.textContent = station.name;
      nextPill.style.display = "none";

      if (currentStation === "catradio") {
        territorialRow.style.visibility = "visible";
        const regionName = territorialSelect.options[territorialSelect.selectedIndex].text;
        programHost.textContent = `Connexió territorial: ${regionName}`;
      } else {
        territorialRow.style.visibility = "hidden";
        programHost.textContent = "Emissió en directe";
      }

      updateTimeshiftVisibility();
      setArtworkSafe(null, station.logo);
      syncMediaSession(station.name, programHost.textContent);
    }

    async function syncMediaSession(title, artist) {
      if (!("mediaSession" in navigator)) return;
      const yellowLogo = await buildYellowCatRadioArtwork();
      const meta = {
        title: title,
        artist: artist,
        album: "3Cat Directe"
      };
      if (yellowLogo) {
        meta.artwork = [{ src: yellowLogo, sizes: "512x512", type: "image/png" }];
      }
      navigator.mediaSession.metadata = new MediaMetadata(meta);
    }

    // Llegeix la programació i caràtula reals des de /api/graella (Vercel)
    async function fetchLiveProgramMetadata() {
      const station = STREAMS[currentStation];
      try {
        const res = await fetch("/api/graella");
        if (!res.ok) return;
        const data = await res.json();
        const info = data?.channels?.[currentStation];
        if (!info || !info.title) return;

        programTitle.textContent = info.title;
        if (info.host) {
          programHost.textContent = info.host;
        }
        if (info.next) {
          nextPill.textContent = info.next;
          nextPill.style.display = "inline-block";
        } else {
          nextPill.style.display = "none";
        }
        if (info.artwork) {
          setArtworkSafe(info.artwork, station.logo);
        }
        syncMediaSession(info.title, info.host || station.name);
      } catch (e) {}
    }

    function setLoading(loading) {
      spinner.style.display = loading ? "block" : "none";
      playBtn.style.display = loading ? "none" : "flex";
    }

    function setPlayingState(playing) {
      isPlaying = playing;
      setLoading(false);
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = playing ? "playing" : "paused";
      }
    }

    function getSeekableRange() {
      if (audio.seekable && audio.seekable.length > 0) {
        const start = audio.seekable.start(0);
        const end = audio.seekable.end(audio.seekable.length - 1);
        if (end > start) return { start, end };
      }
      if (audio.buffered && audio.buffered.length > 0) {
        const start = audio.buffered.start(0);
        const end = audio.buffered.end(audio.buffered.length - 1);
        if (end > start) return { start, end };
      }
      return null;
    }

    function formatCatalanTime(dateObj) {
      return dateObj.toLocaleTimeString("ca-ES", {
        timeZone: "Europe/Madrid",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function updateDvrClockUI() {
      if (!isTimeshiftSupported()) return;
      const nowMs = Date.now() - STREAM_DELAY_SECONDS * 1000;
      const range = getSeekableRange();

      if (!range || !isPlaying) {
        listeningClock.textContent = formatCatalanTime(new Date(nowMs));
        lagTag.textContent = "";
        liveJumpBtn.style.display = "none";
        return;
      }

      const lagSeconds = Math.max(0, Math.round(range.end - audio.currentTime));
      const effectiveLag = isScrubbing ? manualLagSeconds : lagSeconds;
      const listeningDate = new Date(nowMs - effectiveLag * 1000);
      listeningClock.textContent = formatCatalanTime(listeningDate);

      if (!isScrubbing) {
        const span = Math.max(1, range.end - range.start);
        const pct = Math.min(100, Math.max(0, ((audio.currentTime - range.start) / span) * 100));
        scrubber.value = pct.toFixed(1);
      }

      if (effectiveLag >= 15) {
        const mins = Math.floor(effectiveLag / 60);
        const secs = effectiveLag % 60;
        lagTag.textContent = mins > 0 ? `-${mins}m ${String(secs).padStart(2, "0")}s` : `-${secs}s`;
        liveJumpBtn.style.display = "inline-block";
      } else {
        lagTag.textContent = "";
        liveJumpBtn.style.display = "none";
      }
    }

    async function startPlayback(forceReload = false) {
      // Si ja tenim el flux carregat i només estàvem en pausa, reprenem al punt exacte de manera síncrona (vital per a iOS en segon pla)
      if (!forceReload && activeStreamUrl && (audio.src || hlsInstance)) {
        statusMsg.textContent = "";
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            setPlayingState(true);
            startWatchdog();
          }).catch(() => {
            startPlayback(true);
          });
        }
        return;
      }

      setLoading(true);
      statusMsg.textContent = "";
      manualLagSeconds = 0;
      stallCounter = 0;

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const url = await resolveBestStreamUrl();
      activeStreamUrl = url;
      const isNativeHls = Boolean(audio.canPlayType("application/vnd.apple.mpegurl"));

      // 1. Prioritzem HLS natiu a Safari / iOS perquè mantingui la sessió d'àudio viva en segon pla i es pugui reprendre des de fora l'app
      if (isNativeHls && url.includes(".m3u8")) {
        audio.src = url;
        audio.load();
        audio.play().then(() => {
          setPlayingState(true);
          startWatchdog();
        }).catch(() => {
          playFallbackMp3();
        });
        return;
      }

      // 2. En navegadors sense HLS natiu (Chrome/Firefox escriptori o Android), fem servir hls.js
      if (typeof Hls !== "undefined" && Hls.isSupported() && url.includes(".m3u8")) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 7200,
          maxBufferLength: 600,
          maxMaxBufferLength: 1200,
          liveSyncDurationCount: 3
        });
        hlsInstance = hls;
        hls.loadSource(url);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          audio.play().then(() => {
            setPlayingState(true);
            startWatchdog();
          }).catch(() => {
            setLoading(false);
            statusMsg.textContent = "Toca Play per iniciar l'àudio";
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            hls.destroy();
            hlsInstance = null;
            playFallbackMp3();
          }
        });
        return;
      }

      // 3. Fallback directe
      audio.src = url;
      audio.load();
      audio.play().then(() => {
        setPlayingState(true);
        startWatchdog();
      }).catch(() => {
        playFallbackMp3();
      });
    }

    function playFallbackMp3() {
      const mp3Url = STREAMS[currentStation].fallbackMp3;
      activeStreamUrl = mp3Url;
      audio.src = mp3Url;
      audio.play().then(() => {
        setPlayingState(true);
        startWatchdog();
      }).catch(() => {
        setLoading(false);
        statusMsg.textContent = "Toca Play per iniciar l'àudio";
      });
    }

    // Pausa real: manté el buffer i la posició en el temps per no perdre el punt si vas enrere
    function pausePlayback() {
      isPlaying = false;
      clearInterval(watchdogTimer);
      audio.pause();
      setPlayingState(false);
    }

    // Aturada completa amb neteja (només en canviar d'emissora o reconnexió forçada)
    function resetPlayback() {
      isPlaying = false;
      activeStreamUrl = null;
      clearInterval(watchdogTimer);
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setPlayingState(false);
    }

    // Vigilant passiu: no talla l'àudio en segon pla d'iOS i recupera només si hi ha tall real
    function startWatchdog() {
      clearInterval(watchdogTimer);
      let lastTime = audio.currentTime;
      stallCounter = 0;

      watchdogTimer = setInterval(() => {
        if (!isPlaying) return;

        if (audio.currentTime !== lastTime && !audio.paused) {
          lastTime = audio.currentTime;
          stallCounter = 0;
          if (statusMsg.textContent === "Reconnectant senyal...") {
            statusMsg.textContent = "";
          }
          return;
        }

        // Només actuem si porta encallat almenys 2 cicles seguits (~16 segons)
        stallCounter++;
        if (stallCounter >= 2) {
          statusMsg.textContent = "Reconnectant senyal...";
          const savedTime = audio.currentTime;
          audio.play().then(() => {
            if (savedTime > 0 && isTimeshiftSupported()) {
              try { audio.currentTime = savedTime; } catch (e) {}
            }
            stallCounter = 0;
            statusMsg.textContent = "";
          }).catch(() => {
            if (document.visibilityState === "visible") {
              startPlayback(true);
            }
          });
        }
      }, 8000);
    }

    // Sincronització amb controls externs d'iOS (pantalla bloquejada, AirPods, CarPlay)
    audio.addEventListener("pause", () => {
      if (isPlaying) {
        isPlaying = false;
        clearInterval(watchdogTimer);
        setPlayingState(false);
      }
    });

    audio.addEventListener("play", () => {
      if (!isPlaying) {
        setPlayingState(true);
        startWatchdog();
      }
    });

    audio.addEventListener("error", () => {
      if (isPlaying && document.visibilityState === "visible") {
        statusMsg.textContent = "Recuperant connexió...";
        startPlayback(true);
      }
    });

    function commitScrubberPosition() {
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (range) {
        const span = range.end - range.start;
        const targetTime = range.start + (Number(scrubber.value) / 100) * span;
        audio.currentTime = Math.min(range.end, Math.max(range.start, targetTime));
      }
      isScrubbing = false;
      updateDvrClockUI();
    }

    scrubber.addEventListener("pointerdown", () => {
      if (isTimeshiftSupported()) isScrubbing = true;
    });

    scrubber.addEventListener("touchstart", () => {
      if (isTimeshiftSupported()) isScrubbing = true;
    }, { passive: true });

    scrubber.addEventListener("input", () => {
      if (!isTimeshiftSupported()) return;
      isScrubbing = true;
      const range = getSeekableRange();
      if (range) {
        const span = range.end - range.start;
        const targetTime = range.start + (Number(scrubber.value) / 100) * span;
        manualLagSeconds = Math.max(0, Math.round(range.end - targetTime));
        updateDvrClockUI();
      }
    });

    scrubber.addEventListener("change", commitScrubberPosition);
    scrubber.addEventListener("pointerup", commitScrubberPosition);
    scrubber.addEventListener("touchend", commitScrubberPosition);

    document.getElementById("back10Btn").addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (range) {
        audio.currentTime = Math.max(range.start, audio.currentTime - 10);
        updateDvrClockUI();
      }
    });

    document.getElementById("fwd10Btn").addEventListener("click", () => {
      const range = getSeekableRange();
      if (range) {
        audio.currentTime = Math.min(range.end, audio.currentTime + 10);
        updateDvrClockUI();
      }
    });

    liveJumpBtn.addEventListener("click", () => {
      const range = getSeekableRange();
      if (range) {
        audio.currentTime = range.end;
        updateDvrClockUI();
      }
    });

    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback(false);
      }
    });

    document.getElementById("reconnectBtn").addEventListener("click", () => {
      statusMsg.textContent = "Refrescant connexió...";
      resetPlayback();
      startPlayback(true);
    });

    document.querySelectorAll(".station-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".station-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentStation = btn.dataset.id;
        updateBaseUI();
        fetchLiveProgramMetadata();
        resetPlayback();
        startPlayback(true);
      });
    });

    territorialSelect.addEventListener("change", () => {
      updateBaseUI();
      fetchLiveProgramMetadata();
      if (isPlaying || activeStreamUrl) {
        const wasPlaying = isPlaying;
        resetPlayback();
        if (wasPlaying) startPlayback(true);
      }
    });

    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => {
        if (activeStreamUrl && audio.src) {
          audio.play().then(() => {
            setPlayingState(true);
            startWatchdog();
          }).catch(() => startPlayback(false));
        } else {
          startPlayback(false);
        }
      });
      navigator.mediaSession.setActionHandler("pause", pausePlayback);
      navigator.mediaSession.setActionHandler("seekbackward", () => {
        if (!isTimeshiftSupported()) return;
        const range = getSeekableRange();
        if (range) audio.currentTime = Math.max(range.start, audio.currentTime - 10);
      });
      navigator.mediaSession.setActionHandler("seekforward", () => {
        if (!isTimeshiftSupported()) return;
        const range = getSeekableRange();
        if (range) audio.currentTime = Math.min(range.end, audio.currentTime + 10);
      });
    }

    // Inicialització
    updateBaseUI();
    fetchLiveProgramMetadata();
    clockTimer = setInterval(updateDvrClockUI, 1000);
    metadataTimer = setInterval(fetchLiveProgramMetadata, 60000);
  </script>
</body>
</html>
