<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CatRàdio" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icona-catradio.png" />
  <title>CatRàdio Directe</title>
  <!-- hls.js per permetre Timeshift/DVR i memòria cau llarga en navegadors no-Safari -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

  <style>
    @font-face {
      font-family: "Bw3Cat-Regular";
      src: url("/fonts/Bw3Cat-Regular.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Regular.woff") format("woff"),
           url("/fonts/Bw3Cat-Regular.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bw3Cat-Bold";
      src: url("/fonts/Bw3Cat-Bold.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Bold.woff") format("woff"),
           url("/fonts/Bw3Cat-Bold.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bw3Cat-Black";
      src: url("/fonts/Bw3Cat-Black.woff2") format("woff2"),
           url("/fonts/Bw3Cat-Black.woff") format("woff"),
           url("/fonts/Bw3Cat-Black.ttf") format("truetype"),
           url("/fonts/Bw3Cat-Black.otf") format("opentype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-main: "Bw3Cat-Regular", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-bold: "Bw3Cat-Bold", var(--font-main);
      --font-black: "Bw3Cat-Black", var(--font-main);
      --bg: #0a0a0a;
      --card-bg: #141414;
      --border: #262626;
      --accent-color: #ffd100;
      --text: #ffffff;
      --muted: #9ca3af;
      --ambient-color: rgba(255, 209, 0, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, var(--ambient-color) 0%, #0a0a0a 68%);
      transition: background 0.5s ease;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 10px) 20px calc(env(safe-area-inset-bottom, 20px) + 12px) 20px;
    }

    /* Graella de 5 emissores oficials */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-bold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Graella de 5 emissores oficials */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .station-btn {
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .station-btn:active {
      transform: scale(0.95);
    }

    .station-btn img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      filter: brightness(0) invert(1);
      pointer-events: none;
      transition: filter 0.35s ease, opacity 0.35s ease, transform 0.25s ease;
    }

    /* Colors actius oficials per emissora */
    .station-btn[data-id="catradio"].active {
      background: #FFD100;
      border-color: #FFD100;
    }
    .station-btn[data-id="catradio"].active img {
      filter: brightness(0);
    }

    .station-btn[data-id="digital"].active {
      background: #F5A800;
      border-color: #F5A800;
    }
    .station-btn[data-id="digital"].active img {
      filter: brightness(0);
    }

    .station-btn[data-id="catinfo"].active {
      background: #F25400;
      border-color: #F25400;
    }

    .station-btn[data-id="icat"].active {
      background: #C4162A;
      border-color: #C4162A;
    }
    .station-btn[data-id="icat"].active img {
      filter: none;
    }

    .station-btn[data-id="catmusica"].active {
      background: #429B2B;
      border-color: #429B2B;
    }
    .station-btn[data-id="catmusica"].active img {
      filter: brightness(0) invert(1);
    }

    /* Connexió territorial */
    .territorial-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 13px;
      color: #e5e7eb;
    }

    .territorial-select {
      background: transparent;
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 2px;
      outline: none;
      cursor: pointer;
    }

    .territorial-select option {
      background: #141414;
      color: #ffffff;
    }

    .territorial-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid #6b7280;
      border-radius: 50%;
      font-size: 11px;
      color: #d1d5db;
    }

    /* Zona central (Portada i Programa) */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      padding: 8px 0;
    }

    .artwork-wrapper {
      position: relative;
      width: 215px;
      height: 215px;
      border-radius: 8px;
      background: #121212;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.75);
      margin-bottom: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .artwork.is-logo-fallback {
      width: 58%;
      height: 58%;
      object-fit: contain;
      filter: brightness(0) invert(1) opacity(0.35);
    }

    .program-title {
      font-family: var(--font-black);
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .program-host {
      font-size: 14px;
      color: #d1d5db;
      margin: 0;
      line-height: 1.35;
    }

    .next-pill {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 12px;
      border-radius: 999px;
      max-width: 92%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }

    /* Barra de Timeshift / Rellotge */
    .timeshift-box {
      width: 100%;
      margin-bottom: 14px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      color: #d1d5db;
    }

    .lag-tag {
      color: var(--accent-color);
      font-weight: 600;
      margin-left: 6px;
      transition: color 0.3s ease;
    }

    .scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      outline: none;
      cursor: pointer;
      touch-action: none;
      margin: 0;
    }

    .scrubber::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      background: #2f2f2f;
      border-radius: 999px;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      margin-top: -7.5px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .scrubber:active::-webkit-slider-thumb {
      transform: scale(1.25);
      background: var(--accent-color);
    }

    /* Botons de control de reproducció */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 8px;
    }

    .timeshift-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .skip-btn:active {
      background: #262626;
    }

    .live-jump-btn {
      font-family: var(--font-bold);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: none;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .play-wrapper {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      transition: transform 0.12s ease;
    }

    .play-btn:active {
      transform: scale(0.93);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-msg {
      font-size: 12px;
      color: var(--accent-color);
      text-align: center;
      min-height: 16px;
      margin-bottom: 4px;
      transition: color 0.3s ease;
    }

    /* Peu amb reconnexió */
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div>
      <!-- Selector dels 5 canals oficials -->
      <div class="stations-grid" id="stationsGrid">
        <button class="station-btn active" data-id="catradio" aria-label="Catalunya Ràdio">
          <img src="/logos/catradio.svg" onerror="this.src='https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg'" alt="Catràdio" />
        </button>
        <button class="station-btn" data-id="digital" aria-label="Exclusiu Digital">
          <img src="/logos/exclusiudigital.svg" alt="Exclusiu Digital" />
        </button>
        <button class="station-btn" data-id="catinfo" aria-label="3CatInfo">
          <img src="/logos/info.svg" alt="3cat info" />
        </button>
        <button class="station-btn" data-id="icat" aria-label="iCat">
          <img src="/logos/icat.svg" alt="iCat" />
        </button>
        <button class="station-btn" data-id="catmusica" aria-label="CatMúsica">
          <img src="/logos/catmus.svg" alt="CatMúsica" />
        </button>
      </div>

      <!-- Connexió territorial -->
      <div class="territorial-row" id="territorialRow">
        <span>Connexió territorial:</span>
        <select class="territorial-select" id="territorialSelect">
          <option value="barcelona" selected>Barcelona</option>
          <option value="girona">Girona</option>
          <option value="lleida">Lleida</option>
          <option value="tarragona">Tarragona</option>
        </select>
        <span class="territorial-badge">›</span>
      </div>
    </div>

    <!-- Zona central: Caràtula i títol del programa -->
    <div class="center-stage">
      <div class="artwork-wrapper">
        <img id="artwork" class="artwork is-logo-fallback" src="https://statics.3cat.cat/recursos/3cat/logos/web/catradio.svg" alt="Programa" />
      </div>
      <h1 class="program-title" id="programTitle">Catalunya Ràdio</h1>
      <p class="program-host" id="programHost">Connexió territorial: Girona</p>
      <div class="next-pill" id="nextPill"></div>
    </div>

    <!-- Controls de reproducció i Timeshift -->
    <div>
      <div class="timeshift-box" id="timeshiftBox">
        <div class="time-labels">
          <div>
            <span id="listeningClock">--:--:--</span>
            <span class="lag-tag" id="lagTag"></span>
          </div>
          <div>
            <button class="live-jump-btn" id="liveJumpBtn">DIRECTE</button>
          </div>
        </div>
        <input type="range" class="scrubber" id="scrubber" min="0" max="100" value="100" step="0.1" />
      </div>

      <div class="controls-row">
        <button class="skip-btn" id="back10Btn">-10s</button>

        <div class="play-wrapper">
          <div class="spinner" id="spinner"></div>
          <button class="play-btn" id="playBtn" aria-label="Reproduir o pausar">
            <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
            <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
        </div>

        <button class="skip-btn" id="fwd10Btn">+10s</button>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <!-- Peu amb botó de reconnexió forçada -->
      <div class="footer">
        <button class="icon-btn" id="reconnectBtn" title="Forçar reconnexió">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Reproductor natiu HTML5 (màxima estabilitat en segon pla a iOS) -->
  <audio id="audioPlayer" preload="none" playsinline></audio>

  <script>
    const STREAMS = {
      catradio: {
        name: "Catalunya Ràdio",
        pvideoId: "cr",
        logo: "/logos/catradio.svg",
        accent: "#FFD100",
        ambient: "rgba(255, 209, 0, 0.14)",
        urls: {
          barcelona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-hls/master.m3u8",
          girona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-girona-hls/master.m3u8",
          lleida: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-lleida-hls/master.m3u8",
          tarragona: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-tarragona-hls/master.m3u8"
        },
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      digital: {
        name: "CatRàdio Exclusiu Digital",
        pvideoId: "ocr1",
        logo: "/logos/exclusiudigital.svg",
        accent: "#F5A800",
        ambient: "rgba(245, 168, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-radio-digital-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyaradioHD.mp3"
      },
      catinfo: {
        name: "3CatInfo",
        pvideoId: "ci",
        logo: "/logos/info.svg",
        accent: "#F25400",
        ambient: "rgba(242, 84, 0, 0.14)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-informacio-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyainformacioHD.mp3"
      },
      icat: {
        name: "iCat",
        pvideoId: "ic",
        logo: "/logos/icat.svg",
        accent: "#C4162A",
        ambient: "rgba(196, 22, 42, 0.16)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/icat-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/icatHD.mp3"
      },
      catmusica: {
        name: "Catalunya Música",
        pvideoId: "cm",
        logo: "/logos/catmus.svg",
        accent: "#429B2B",
        ambient: "rgba(66, 155, 43, 0.15)",
        url: "https://directes-radio-int.3catdirectes.cat/live-content/catalunya-musica-hls/master.m3u8",
        fallbackMp3: "https://shoutcast.ccma.cat/ccma/catalunyamusicaHD.mp3"
      }
    };

    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const spinner = document.getElementById("spinner");
    const statusMsg = document.getElementById("statusMsg");
    const programTitle = document.getElementById("programTitle");
    const programHost = document.getElementById("programHost");
    const nextPill = document.getElementById("nextPill");
    const artwork = document.getElementById("artwork");
    const territorialRow = document.getElementById("territorialRow");
    const territorialSelect = document.getElementById("territorialSelect");
    const timeshiftBox = document.getElementById("timeshiftBox");
    const back10Btn = document.getElementById("back10Btn");
    const fwd10Btn = document.getElementById("fwd10Btn");
    const listeningClock = document.getElementById("listeningClock");
    const lagTag = document.getElementById("lagTag");
    const liveJumpBtn = document.getElementById("liveJumpBtn");
    const scrubber = document.getElementById("scrubber");

    const STREAM_DELAY_SECONDS = 10; // Compensació del retard habitual del flux HLS
    let currentStation = "catradio";
    let isPlaying = false;
    let hlsInstance = null;
    let isScrubbing = false;
    let manualLagSeconds = 0;
    let activeStreamUrl = null;
    let stallCounter = 0;
    let watchdogTimer = null;
    let clockTimer = null;
    let metadataTimer = null;

    function isTimeshiftSupported() {
      if (currentStation === "catradio" && territorialSelect.value !== "barcelona") {
        return false;
      }
      return true;
    }

    function updateTimeshiftVisibility() {
      const supported = isTimeshiftSupported();
      timeshiftBox.classList.toggle("timeshift-hidden", !supported);
      back10Btn.classList.toggle("timeshift-hidden", !supported);
      fwd10Btn.classList.toggle("timeshift-hidden", !supported);
      if (!supported) {
        liveJumpBtn.style.display = "none";
        lagTag.textContent = "";
      }
    }

    function getStreamUrl() {
      const st = STREAMS[currentStation];
      if (currentStation === "catradio") {
        return st.urls[territorialSelect.value] || st.urls.barcelona;
      }
      return st.url;
    }

    function syncMediaSession(title, artist) {
      if (!("mediaSession" in navigator)) return;
      const iconUrl = new URL("/catradio_player.jpg", window.location.origin).href;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: artist,
        album: "3Cat Directe",
        artwork: [
          { src: iconUrl, sizes: "512x512", type: "image/jpeg" },
          { src: iconUrl, sizes: "1024x1024", type: "image/jpeg" }
        ]
      });
    }

    function setArtworkSafe(url, fallbackLogo) {
      if (!url) {
        artwork.src = fallbackLogo;
        artwork.classList.add("is-logo-fallback");
        return;
      }
      const tester = new Image();
      tester.onload = () => {
        artwork.src = url;
        artwork.classList.remove("is-logo-fallback");
      };
      tester.onerror = () => {
        artwork.src = fallbackLogo;
        artwork.classList.add("is-logo-fallback");
      };
      tester.src = url;
    }

    // Llegeix la programació i caràtula reals des de /api/graella (Vercel)
    async function fetchLiveProgramMetadata() {
      const st = STREAMS[currentStation];
      const terrName = territorialSelect.options[territorialSelect.selectedIndex].text;
      const defaultSubtitle = currentStation === "catradio"
        ? `Connexió territorial: ${terrName}`
        : "Emissió en directe";

      try {
        const res = await fetch("/api/graella", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          const info = data?.channels?.[currentStation];
          if (info && info.title) {
            programTitle.textContent = info.title;
            programHost.textContent = info.host || defaultSubtitle;
            if (info.next) {
              nextPill.textContent = info.next;
              nextPill.style.display = "inline-block";
            } else {
              nextPill.style.display = "none";
            }
            setArtworkSafe(info.artwork, st.logo);
            syncMediaSession(info.title, info.host || st.name);
            return;
          }
        }
      } catch (e) {}

      // Fallback net sense inventar programes si no hi ha resposta
      programTitle.textContent = st.name;
      programHost.textContent = defaultSubtitle;
      nextPill.style.display = "none";
      setArtworkSafe(null, st.logo);
      syncMediaSession(st.name, defaultSubtitle);
    }

    function getSeekableRange() {
      if (audio.seekable && audio.seekable.length > 0) {
        const end = audio.seekable.end(audio.seekable.length - 1);
        const start = audio.seekable.start(0);
        if (isFinite(start) && isFinite(end) && end > start) {
          return { start, end };
        }
      }
      if (audio.buffered && audio.buffered.length > 0) {
        const end = audio.buffered.end(audio.buffered.length - 1);
        const start = audio.buffered.start(0);
        if (isFinite(start) && isFinite(end) && end > start) {
          return { start, end };
        }
      }
      return null;
    }

    function formatCatalanTime(dateObj) {
      return dateObj.toLocaleTimeString("ca-ES", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function updateDvrClockUI() {
      if (!isTimeshiftSupported()) return;

      const range = getSeekableRange();
      let lagSeconds = 0;

      if (range && isPlaying) {
        lagSeconds = Math.max(0, Math.round(range.end - audio.currentTime));
        if (!isScrubbing) {
          const totalSpan = Math.max(1, range.end - range.start);
          const pct = Math.min(100, Math.max(0, ((audio.currentTime - range.start) / totalSpan) * 100));
          scrubber.value = pct.toFixed(1);
        }
      } else if (!isScrubbing) {
        scrubber.value = "100";
      }

      const emissionTimestamp = Date.now() - ((STREAM_DELAY_SECONDS + lagSeconds) * 1000);
      listeningClock.textContent = formatCatalanTime(new Date(emissionTimestamp));

      if (lagSeconds > 4) {
        const mins = Math.floor(lagSeconds / 60);
        const secs = lagSeconds % 60;
        lagTag.textContent = mins > 0 ? `(-${mins}m ${secs}s)` : `(-${secs}s)`;
        liveJumpBtn.style.display = "inline-block";
      } else {
        lagTag.textContent = "";
        liveJumpBtn.style.display = "none";
      }
    }

    function setLoading(loading) {
      spinner.style.display = loading ? "block" : "none";
      playBtn.style.display = loading ? "none" : "flex";
    }

    function setPlayingState(playing) {
      isPlaying = playing;
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = playing ? "playing" : "paused";
      }
    }

    async function resolvePvideoDvrStream(baseUrl) {
      if (!isTimeshiftSupported()) return baseUrl;
      const st = STREAMS[currentStation];
      try {
        const res = await fetch(`/api/dvr?id=${encodeURIComponent(st.pvideoId)}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          const urlList = data?.media?.url || [];
          const hlsItem = urlList.find((u) => typeof u.file === "string" && u.file.includes(".m3u8"));
          if (hlsItem && hlsItem.file) {
            return hlsItem.file;
          }
        }
      } catch (e) {}
      return baseUrl;
    }

    async function startPlayback(forceReload = false) {
      const baseUrl = getStreamUrl();
      statusMsg.textContent = "";

      // Si ja tenim el mateix flux carregat i no és una reconnexió forçada, reprenem al punt exacte
      if (!forceReload && activeStreamUrl === baseUrl && audio.src) {
        try {
          await audio.play();
          setPlayingState(true);
          return;
        } catch (err) {}
      }

      setLoading(true);
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const streamUrl = await resolvePvideoDvrStream(baseUrl);
      activeStreamUrl = baseUrl;

      // Prioritzem el motor natiu HLS a Safari/iOS per màxima estabilitat en segon pla
      const isNativeHls = audio.canPlayType("application/vnd.apple.mpegurl") !== "";

      if (isNativeHls) {
        audio.src = streamUrl;
        try {
          await audio.play();
          setLoading(false);
          setPlayingState(true);
        } catch (err) {
          // Fallback a MP3 oficial de la CCMA si falla el manifest HLS
          audio.src = STREAMS[currentStation].fallbackMp3;
          try {
            await audio.play();
            setLoading(false);
            setPlayingState(true);
          } catch (e2) {
            setLoading(false);
            setPlayingState(false);
            statusMsg.textContent = "Toca Play per iniciar l'àudio";
          }
        }
      } else if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          backBufferLength: 7200,
          maxBufferLength: 600,
          liveSyncDurationCount: 3
        });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(audio);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, async () => {
          try {
            await audio.play();
            setLoading(false);
            setPlayingState(true);
          } catch (err) {
            setLoading(false);
            setPlayingState(false);
          }
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            hlsInstance.destroy();
            hlsInstance = null;
            audio.src = STREAMS[currentStation].fallbackMp3;
            audio.play().then(() => {
              setLoading(false);
              setPlayingState(true);
            }).catch(() => {
              setLoading(false);
              setPlayingState(false);
              statusMsg.textContent = "Error de connexió amb el directe";
            });
          }
        });
      } else {
        audio.src = STREAMS[currentStation].fallbackMp3;
        audio.play().then(() => {
          setLoading(false);
          setPlayingState(true);
        }).catch(() => {
          setLoading(false);
          setPlayingState(false);
        });
      }
    }

    function pausePlayback() {
      audio.pause();
      setPlayingState(false);
    }

    // Controls des de la pantalla bloquejada i auriculars d'iOS
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => {
        if (audio.src) {
          audio.play().then(() => setPlayingState(true)).catch(() => startPlayback(false));
        } else {
          startPlayback(false);
        }
      });

      navigator.mediaSession.setActionHandler("pause", () => {
        pausePlayback();
      });

      navigator.mediaSession.setActionHandler("seekbackward", (details) => {
        if (!isTimeshiftSupported()) return;
        const offset = details.seekOffset || 10;
        const range = getSeekableRange();
        if (range) {
          audio.currentTime = Math.max(range.start, audio.currentTime - offset);
          updateDvrClockUI();
        }
      });

      navigator.mediaSession.setActionHandler("seekforward", (details) => {
        if (!isTimeshiftSupported()) return;
        const offset = details.seekOffset || 10;
        const range = getSeekableRange();
        if (range) {
          audio.currentTime = Math.min(range.end - 1, audio.currentTime + offset);
          updateDvrClockUI();
        }
      });
    }

    // Esdeveniments d'àudio natius (sincronitza estat i recupera micro-talls sense reiniciar)
    audio.addEventListener("play", () => setPlayingState(true));
    audio.addEventListener("pause", () => setPlayingState(false));
    audio.addEventListener("playing", () => {
      setLoading(false);
      stallCounter = 0;
      statusMsg.textContent = "";
    });
    audio.addEventListener("waiting", () => {
      if (isPlaying) statusMsg.textContent = "Carregant àudio...";
    });
    audio.addEventListener("stalled", () => {
      if (!isPlaying) return;
      stallCounter++;
      if (stallCounter >= 3) {
        stallCounter = 0;
        const savedTime = audio.currentTime;
        audio.play().then(() => {
          if (savedTime > 0 && isTimeshiftSupported()) {
            try { audio.currentTime = savedTime; } catch (e) {}
          }
        }).catch(() => {});
      }
    });

    // Botó principal Play / Pause
    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback(false);
      }
    });

    // Botó de reconnexió forçada al directe
    document.getElementById("reconnectBtn").addEventListener("click", () => {
      statusMsg.textContent = "Reconnectant al directe...";
      startPlayback(true);
    });

    // Botons -10s i +10s
    back10Btn.addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (!range) return;
      audio.currentTime = Math.max(range.start, audio.currentTime - 10);
      updateDvrClockUI();
    });

    fwd10Btn.addEventListener("click", () => {
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (!range) return;
      audio.currentTime = Math.min(range.end - 1, audio.currentTime + 10);
      updateDvrClockUI();
    });

    // Saltar de nou al directe viu
    liveJumpBtn.addEventListener("click", () => {
      const range = getSeekableRange();
      if (range) {
        audio.currentTime = Math.max(range.start, range.end - 1);
        updateDvrClockUI();
      } else {
        startPlayback(true);
      }
    });

    // Interacció tàctil fluida amb la barra de Timeshift
    const beginScrub = () => {
      if (!isTimeshiftSupported()) return;
      isScrubbing = true;
    };

    const previewScrub = () => {
      if (!isTimeshiftSupported() || !isScrubbing) return;
      const range = getSeekableRange();
      if (!range) return;
      const pct = parseFloat(scrubber.value) / 100;
      const targetTime = range.start + pct * (range.end - range.start);
      const lagSeconds = Math.max(0, Math.round(range.end - targetTime));
      const emissionTimestamp = Date.now() - ((STREAM_DELAY_SECONDS + lagSeconds) * 1000);
      listeningClock.textContent = formatCatalanTime(new Date(emissionTimestamp));
      if (lagSeconds > 4) {
        const mins = Math.floor(lagSeconds / 60);
        const secs = lagSeconds % 60;
        lagTag.textContent = mins > 0 ? `(-${mins}m ${secs}s)` : `(-${secs}s)`;
      } else {
        lagTag.textContent = "";
      }
    };

    const commitScrub = () => {
      if (!isScrubbing) return;
      isScrubbing = false;
      if (!isTimeshiftSupported()) return;
      const range = getSeekableRange();
      if (!range) return;
      const pct = parseFloat(scrubber.value) / 100;
      const targetTime = range.start + pct * (range.end - range.start);
      audio.currentTime = Math.min(range.end - 0.5, Math.max(range.start, targetTime));
      updateDvrClockUI();
    };

    scrubber.addEventListener("pointerdown", beginScrub);
    scrubber.addEventListener("touchstart", beginScrub, { passive: true });
    scrubber.addEventListener("input", previewScrub);
    scrubber.addEventListener("change", commitScrub);
    scrubber.addEventListener("pointerup", commitScrub);
    scrubber.addEventListener("touchend", commitScrub);

    // Selector d'emissores
    document.getElementById("stationsGrid").addEventListener("click", (e) => {
      const btn = e.target.closest(".station-btn");
      if (!btn) return;
      const newId = btn.dataset.id;
      if (newId === currentStation) return;

      document.querySelectorAll(".station-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      currentStation = newId;
      document.documentElement.style.setProperty("--ambient-color", STREAMS[currentStation].ambient);
      document.documentElement.style.setProperty("--accent-color", STREAMS[currentStation].accent);
      territorialRow.style.visibility = currentStation === "catradio" ? "visible" : "hidden";

      updateTimeshiftVisibility();
      fetchLiveProgramMetadata();
      startPlayback(true);
    });

    // Selector de connexió territorial (Barcelona, Girona, Lleida, Tarragona)
    territorialSelect.addEventListener("change", () => {
      updateTimeshiftVisibility();
      fetchLiveProgramMetadata();
      startPlayback(true);
    });

    // Inicialització
    updateTimeshiftVisibility();
    fetchLiveProgramMetadata();
    updateDvrClockUI();

    clockTimer = setInterval(updateDvrClockUI, 1000);
    metadataTimer = setInterval(fetchLiveProgramMetadata, 45000);
  </script>
</body>
</html>
